<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <title>Calificar consulta | MediCitas SSL</title>
    <script>
        fetch('/api/auth-status.php').then(r=>r.json()).then(d=>{
            if (!d.loggedIn) {
                const ret = encodeURIComponent(location.href);
                window.location.replace('/index.html?redirect=' + ret);
            }
        });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="css/estilo.css">
    <style>
        .cal-wrap {
            max-width: 560px;
            margin: 0 auto;
        }
        .cal-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 4px 6px rgba(0,0,0,.03);
        }
        .cal-card h2 {
            font-size: 1.5rem;
            color: #0f172a;
            margin: 0 0 6px;
        }
        .cal-card .subtitulo {
            color: #64748b;
            font-size: .95rem;
            margin: 0 0 28px;
        }
        .cita-resumen {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 28px;
        }
        .cita-resumen p {
            margin: 5px 0;
            font-size: .9rem;
            color: #374151;
        }

        /* ── Selector de estrellas ── */
        .star-selector {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 8px 0 24px;
        }
        .star-selector button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            font-size: 40px;
            line-height: 1;
            color: #d1d5db;
            transition: color .1s, transform .1s;
        }
        .star-selector button.activa,
        .star-selector button.hover {
            color: #f59e0b;
        }
        .star-selector button:hover { transform: scale(1.15); }
        .star-label {
            text-align: center;
            font-size: .9rem;
            font-weight: 600;
            color: #92400e;
            min-height: 1.4em;
            margin-bottom: 20px;
        }

        .cal-label {
            display: block;
            font-size: .9rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }
        .cal-textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: .9rem;
            font-family: inherit;
            color: #1e293b;
            resize: vertical;
            min-height: 100px;
            outline: none;
            box-sizing: border-box;
            transition: border .15s;
        }
        .cal-textarea:focus { border-color: #005f99; box-shadow: 0 0 0 3px rgba(0,95,153,.12); }

        .cal-anon {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 16px 0 28px;
            cursor: pointer;
            font-size: .9rem;
            color: #475569;
        }
        .cal-anon input { width: 16px; height: 16px; cursor: pointer; accent-color: #005f99; }

        .btn-enviar {
            width: 100%;
            padding: 13px;
            background: #f59e0b;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s;
        }
        .btn-enviar:hover:not(:disabled) { background: #d97706; }
        .btn-enviar:disabled { opacity: .55; cursor: not-allowed; }

        .estado-msg {
            text-align: center;
            padding: 40px 20px;
        }
        .estado-msg .icono { font-size: 52px; margin-bottom: 12px; }
        .estado-msg h3 { margin: 0 0 8px; font-size: 1.3rem; }
        .estado-msg p { color: #64748b; margin: 0 0 20px; }
    </style>
</head>
<body class="cuerpo-pagina">

    <div id="nav-container"></div>

    <main class="contenido-pagina">
        <div class="cal-wrap">
            <div class="cal-card" id="cal-card">
                <p style="color:#94a3b8;text-align:center;padding:30px 0;">Cargando...</p>
            </div>
        </div>
    </main>

    <script>
        fetch('nav-user.html').then(r=>r.text()).then(d=>{document.getElementById('nav-container').innerHTML=d;});

        const params  = new URLSearchParams(location.search);
        const idCita  = parseInt(params.get('cita'));
        const calInicial = parseInt(params.get('cal')) || 0;  // pre-selección desde el correo

        const etiquetas = ['', 'Muy mala', 'Regular', 'Buena', 'Muy buena', '¡Excelente!'];
        let calSeleccionada = 0;

        function renderEstrellas(sel) {
            return Array.from({length:5}, (_,i) => {
                const n = i + 1;
                const fill = n <= sel ? `font-variation-settings:'FILL' 1;color:#f59e0b;` : 'color:#d1d5db;';
                return `<button type="button" class="star-btn${n <= sel ? ' activa' : ''}"
                            data-val="${n}"
                            onmouseenter="hoverStar(${n})"
                            onmouseleave="clearHover()"
                            onclick="seleccionar(${n})"
                            style="background:none;border:none;cursor:pointer;padding:4px;font-size:40px;line-height:1;${fill}transition:color .1s,transform .1s;"
                            aria-label="${n} estrella${n>1?'s':''}">★</button>`;
            }).join('');
        }

        function hoverStar(n) {
            document.querySelectorAll('.star-btn').forEach((b,i) => {
                b.style.color = (i+1) <= n ? '#f59e0b' : '#d1d5db';
            });
        }
        function clearHover() {
            document.querySelectorAll('.star-btn').forEach((b,i) => {
                b.style.color = (i+1) <= calSeleccionada ? '#f59e0b' : '#d1d5db';
            });
        }
        function seleccionar(n) {
            calSeleccionada = n;
            document.querySelectorAll('.star-btn').forEach((b,i) => {
                b.style.color = (i+1) <= n ? '#f59e0b' : '#d1d5db';
            });
            document.getElementById('star-label').textContent = etiquetas[n] ?? '';
            document.getElementById('btn-enviar').disabled = false;
        }

        async function enviar() {
            if (!calSeleccionada) return;
            const btn       = document.getElementById('btn-enviar');
            const comentario = document.getElementById('comentario').value.trim();
            const anonimo    = document.getElementById('anonimo').checked;

            btn.disabled    = true;
            btn.textContent = 'Enviando…';

            try {
                const r = await fetch('/api/valoraciones.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id_cita: idCita, calificacion: calSeleccionada, comentario, anonimo }),
                });
                const data = await r.json().catch(()=>({}));
                if (!r.ok) throw new Error(data.error ?? 'No se pudo guardar');

                document.getElementById('cal-card').innerHTML = `
                    <div class="estado-msg">
                        <div class="icono">⭐</div>
                        <h3 style="color:#10b981;">¡Gracias por tu calificación!</h3>
                        <p>Tu opinión ayuda a mejorar el servicio y a otros pacientes a elegir su médico.</p>
                        <a href="mis-citas.html" class="btn-primary">Ver mis citas</a>
                    </div>`;
            } catch (err) {
                alert(err.message);
                btn.disabled    = false;
                btn.textContent = 'Enviar calificación';
            }
        }

        async function cargar() {
            if (!idCita) {
                document.getElementById('cal-card').innerHTML =
                    '<p style="color:#ef4444;text-align:center;padding:30px;">Cita no especificada.</p>';
                return;
            }

            // Verificar si ya fue calificada
            const [citaRes, valRes] = await Promise.all([
                fetch(`/api/citas.php?id=${idCita}`).then(r=>r.json()),
                fetch(`/api/valoraciones.php?cita=${idCita}`).then(r=>r.json()),
            ]);

            if (citaRes.error) {
                document.getElementById('cal-card').innerHTML =
                    `<p style="color:#ef4444;text-align:center;padding:30px;">${citaRes.error}</p>`;
                return;
            }

            if (valRes.existe) {
                const cal = valRes.valoracion;
                const estrellas = '★'.repeat(parseInt(cal.calificacion)) + '☆'.repeat(5 - parseInt(cal.calificacion));
                document.getElementById('cal-card').innerHTML = `
                    <div class="estado-msg">
                        <div class="icono" style="color:#f59e0b;">${estrellas}</div>
                        <h3 style="color:#005f99;">Ya calificaste esta consulta</h3>
                        <p>Diste <strong>${cal.calificacion} de 5 estrellas</strong>${cal.comentario ? ' y dejaste un comentario' : ''}.</p>
                        <a href="mis-citas.html" class="btn-primary">Ver mis citas</a>
                    </div>`;
                return;
            }

            if (citaRes.nombre_estado !== 'Concluida') {
                document.getElementById('cal-card').innerHTML = `
                    <div class="estado-msg">
                        <div class="icono">ℹ️</div>
                        <h3 style="color:#64748b;">Cita no disponible para calificar</h3>
                        <p>Solo puedes calificar citas que ya hayan concluido. Estado actual: <strong>${citaRes.nombre_estado}</strong>.</p>
                        <a href="mis-citas.html" class="btn-primary">Ver mis citas</a>
                    </div>`;
                return;
            }

            const gm  = citaRes.genero_medico;
            const tit = gm === 'M' ? 'Dr.' : gm === 'F' ? 'Dra.' : 'Dr(a).';
            const fecha = new Date(citaRes.fecha_cita + 'T12:00:00').toLocaleDateString('es-MX',
                { weekday:'long', year:'numeric', month:'long', day:'numeric' });

            // Inicializar con la calificación venida del correo (si aplica)
            calSeleccionada = calInicial >= 1 && calInicial <= 5 ? calInicial : 0;
            const btnDisabled = calSeleccionada === 0 ? 'disabled' : '';
            const labelInicial = calSeleccionada ? etiquetas[calSeleccionada] : '';

            document.getElementById('cal-card').innerHTML = `
                <h2>⭐ Califica tu consulta</h2>
                <p class="subtitulo">Tu opinión es anónima para el médico si lo prefieres.</p>

                <div class="cita-resumen">
                    <p><strong>📅 ${fecha}</strong></p>
                    <p>👨‍⚕️ ${tit} ${citaRes.nombre_medico} — ${citaRes.nombre_especialidad}</p>
                </div>

                <p style="text-align:center;font-size:.95rem;color:#374151;margin:0 0 8px;font-weight:600;">
                    ¿Cómo calificarías la atención?
                </p>
                <div style="display:flex;justify-content:center;gap:8px;margin-bottom:8px;">
                    ${renderEstrellas(calSeleccionada)}
                </div>
                <div class="star-label" id="star-label">${labelInicial}</div>

                <label class="cal-label" for="comentario">
                    Comentario <span style="font-weight:400;color:#94a3b8;">(opcional)</span>
                </label>
                <textarea id="comentario" class="cal-textarea"
                    placeholder="Cuéntanos cómo fue tu experiencia con el médico..."></textarea>

                <label class="cal-anon">
                    <input type="checkbox" id="anonimo">
                    Publicar como anónimo (tu nombre no aparecerá en la reseña)
                </label>

                <button id="btn-enviar" class="btn-enviar" onclick="enviar()" ${btnDisabled}>
                    Enviar calificación
                </button>`;

            // Si vino calificación del correo, activar visualmente
            if (calSeleccionada) {
                document.querySelectorAll('.star-btn').forEach((b,i) => {
                    b.style.color = (i+1) <= calSeleccionada ? '#f59e0b' : '#d1d5db';
                });
            }
        }

        cargar();
    </script>
</body>
</html>
