<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calificar cita | MediCitas SSL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<div class="proto-shell">
  <div id="nav-container"></div>
  <main>
    <div class="page" style="max-width:720px;">

      <div class="page-header">
        <p class="eyebrow">Tu opinión nos importa</p>
        <h1>Califica tu consulta</h1>
        <p>Tu retroalimentación nos ayuda a mejorar la atención del sanatorio.</p>
      </div>

      <div class="card" style="padding:0;overflow:hidden;">
        <div style="padding:28px 32px;background:var(--surface-2);border-bottom:1px solid var(--border);">
          <div class="row" style="gap:16px;">
            <div class="doc-pick-avatar" id="cal-iniciales">??</div>
            <div>
              <strong id="cal-medico" style="display:block;font-size:17px;font-family:var(--font-display);font-weight:500;">Cargando...</strong>
              <span id="cal-info" style="color:var(--text-3);font-size:13px;">—</span>
            </div>
          </div>
        </div>

        <div style="padding:32px;">
          <div style="text-align:center;margin-bottom:32px;">
            <p style="color:var(--text-3);font-size:13px;margin-bottom:14px;text-transform:uppercase;letter-spacing:0.08em;font-weight:600;">
              ¿Cómo calificarías esta consulta?
            </p>
            <div class="rating-stars" id="rating-main"></div>
            <p id="rating-label" style="margin-top:12px;font-family:var(--font-display);font-size:18px;color:var(--text);font-weight:500;">—</p>
          </div>

          <div class="divider" style="margin:24px 0;"></div>

          <h3 style="font-size:16px;margin-bottom:16px;">Aspectos específicos</h3>
          <div class="stack" style="gap:14px;" id="aspects">
            <!-- inyectado por JS -->
          </div>

          <div class="divider" style="margin:24px 0;"></div>

          <div class="field">
            <label>¿Quieres compartir algo más? (opcional)</label>
            <textarea class="input" id="comentario" style="min-height:100px;resize:vertical;font-family:inherit;" placeholder="Cuéntanos sobre tu experiencia..."></textarea>
          </div>

          <div class="row" style="margin-top:18px;gap:12px;padding:14px;background:var(--surface-2);border-radius:var(--r-sm);">
            <input type="checkbox" id="recomendar" checked style="width:16px;height:16px;accent-color:var(--primary);">
            <label for="recomendar" style="font-size:14px;color:var(--text-2);cursor:pointer;">
              Recomendaría a este médico a un familiar o amigo.
            </label>
          </div>

          <div class="row" style="margin-top:28px;gap:12px;justify-content:flex-end;">
            <a href="mis-citas.html" class="btn btn-ghost">No ahora</a>
            <button class="btn btn-primary" id="btn-enviar">Enviar calificación <i data-icon="check"></i></button>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="js/utils.js"></script>
<script src="js/icons.js"></script>
<script>
  MC.loadNav('nav-user.html');

  const ASPECTS = [
    ['puntualidad', 'Puntualidad de la cita'],
    ['trato', 'Trato del personal médico'],
    ['instalaciones', 'Limpieza e instalaciones'],
    ['comunicacion', 'Comunicación y explicación'],
  ];
  const LABELS = ['', 'Muy mala', 'Mejorable', 'Buena', 'Muy buena', 'Excelente'];

  let main = 5;
  let hover = 0;
  const aspects = { puntualidad: 5, trato: 5, instalaciones: 5, comunicacion: 5 };

  function star(filled, size, big = false) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${filled ? 'var(--warm)' : 'none'}" stroke="${filled ? 'var(--warm)' : 'var(--border-strong)'}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"${big ? ' style="transition: all .15s"' : ''}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;
  }

  function renderMain() {
    const root = document.getElementById('rating-main');
    root.innerHTML = [1,2,3,4,5].map(n => {
      const filled = n <= (hover || main);
      return `<button class="rating-star" data-n="${n}">${star(filled, 42, true)}</button>`;
    }).join('');
    root.querySelectorAll('button').forEach(b => {
      b.addEventListener('mouseenter', () => { hover = parseInt(b.dataset.n); renderMain(); });
      b.addEventListener('mouseleave', () => { hover = 0; renderMain(); });
      b.addEventListener('click', () => { main = parseInt(b.dataset.n); renderMain(); document.getElementById('rating-label').textContent = LABELS[main]; });
    });
    document.getElementById('rating-label').textContent = LABELS[main];
  }

  function renderAspects() {
    const root = document.getElementById('aspects');
    root.innerHTML = ASPECTS.map(([key, label]) => `
      <div class="aspect-row">
        <span style="font-size:14px;color:var(--text-2);">${label}</span>
        <div class="row" style="gap:2px;" data-asp="${key}">
          ${[1,2,3,4,5].map(n => `<button data-n="${n}" style="background:none;border:0;cursor:pointer;padding:2px;">${star(n <= aspects[key], 18)}</button>`).join('')}
        </div>
      </div>
    `).join('');
    root.querySelectorAll('[data-asp]').forEach(group => {
      const key = group.dataset.asp;
      group.querySelectorAll('button').forEach(b => {
        b.addEventListener('click', () => { aspects[key] = parseInt(b.dataset.n); renderAspects(); });
      });
    });
  }

  document.getElementById('btn-enviar').addEventListener('click', async function () {
    this.disabled = true;
    this.textContent = 'Enviando...';
    const params = new URLSearchParams(window.location.search);
    const idCita = params.get('id');
    try {
      const res = await fetch('/api/valoraciones.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          id_cita: idCita,
          calificacion: main,
          puntualidad: aspects.puntualidad,
          trato: aspects.trato,
          instalaciones: aspects.instalaciones,
          comunicacion: aspects.comunicacion,
          comentario: document.getElementById('comentario').value,
          recomendaria: document.getElementById('recomendar').checked ? 1 : 0,
        }),
      });
      const data = await res.json();
      if (data.success) {
        MC.toast('¡Gracias por tu calificación!', 'success');
        setTimeout(() => window.location.href = 'mis-citas.html', 1500);
      } else {
        MC.toast(data.error || 'Error al enviar', 'error');
        this.disabled = false;
        this.innerHTML = 'Enviar calificación <i data-icon="check"></i>';
        MCIcons.render(this);
      }
    } catch {
      MC.toast('No se pudo conectar', 'error');
      this.disabled = false;
      this.innerHTML = 'Enviar calificación <i data-icon="check"></i>';
      MCIcons.render(this);
    }
  });

  (async function () {
    await MC.requireAuth();
    const params = new URLSearchParams(window.location.search);
    const idCita = params.get('id');
    if (idCita) {
      try {
        const c = await fetch('/api/citas.php?id=' + idCita).then(r => r.json());
        if (c) {
          document.getElementById('cal-medico').textContent = MC.drLabel(c.genero_medico) + ' ' + (c.nombre_medico || '');
          document.getElementById('cal-iniciales').textContent = MC.iniciales(c.nombre_medico || 'Dr');
          document.getElementById('cal-info').textContent = (c.nombre_especialidad || '') + ' · ' + MC.fechaLarga(c.fecha_cita) + ' · ' + MC.horaLabel(c.hora_inicio);
        }
      } catch {}
    } else {
      document.getElementById('cal-medico').textContent = 'Cita reciente';
      document.getElementById('cal-info').textContent = 'Comparte tu opinión';
    }
    renderMain();
    renderAspects();
  })();
</script>

</body>
</html>
