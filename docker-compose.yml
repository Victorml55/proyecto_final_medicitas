services:
  postgres:
    image: postgres:16
    container_name: medicitas_db
    restart: "no"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: medicitas
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
  php:
    build: .
    container_name: medicitas_php
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      - postgres

volumes:
  postgres_data:
  vendor_data:
