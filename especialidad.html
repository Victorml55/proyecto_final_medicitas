<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Especialidades | MediCitas SSL</title>
    <link rel="stylesheet" href="css/estilo.css">
<body class="cuerpo-pagina">
    
<div id="nav-container"></div>

    <main class="contenido-pagina">
        <div class="section-header">
            <h1>Nuestras Especialidades</h1>
            <p>Atención médica de excelencia con los mejores especialistas de la región.</p>
        </div>

        <div class="specialties-grid" id="specialties-grid">
            <p id="cargando">Cargando especialidades...</p>
        </div>
    </main>

    <script>
        fetch('nav.html')
            .then(r => r.text())
            .then(data => { document.getElementById('nav-container').innerHTML = data; });

        fetch('api/especialidades.php')
            .then(r => r.json())
            .then(especialidades => {
                const grid = document.getElementById('specialties-grid');
                const activas = especialidades.filter(e => e.activo);
                if (activas.length === 0) {
                    grid.innerHTML = '<p>No hay especialidades disponibles.</p>';
                    return;
                }
                grid.innerHTML = activas.map(e => `
                    <div class="specialty-item">
                        <h2>${e.nombre_especialidad}</h2>
                        <p>${e.descripcion ?? ''}</p>
                    </div>`).join('');
            })
            .catch(() => {
                document.getElementById('specialties-grid').innerHTML =
                    '<p>Error al cargar las especialidades.</p>';
            });
    </script>
</body>
</html>
