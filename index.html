<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | MediCitas SSL</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="nav-container"></div>
    <div class="login-wrapper">
        
        <div class="login-side">
            <div class="login-content">
                <div class="logo-area">
                    
                    <h2>Sanatorio Santa Lucía</h2>
                    
                </div>

                <div class="form-header">
                    <h1>Bienvenido de nuevo</h1>
                    <p>Por favor, ingresa tus credenciales para acceder.</p>
                </div>

                <form action="login.php" method="POST" class="login-form">
                    <div class="input-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>

                    <div class="form-actions">
                        <div class="remember-me">
                            <input type="checkbox" id="remember">
                            <label for="remember">Recordarme</label>
                        </div>
                        <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" class="btn-login">Ingresar</button>
                </form>

                <div class="register-link">
                    <p>¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
                </div>
            </div>
        </div>


<div class="image-side" style="background-image: url('/img/consultorio.png');">
    <div class="overlay">
        <div class="overlay-text">
            <h2>Tu salud, nuestro compromiso</h2>
        </div>
    </div>
</div>

    </div>

<script>
        fetch('/nav.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('nav-container').innerHTML = data;
            });
    </script>
</body>
</html>
