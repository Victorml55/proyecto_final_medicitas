<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>Mi Panel | MediCitas SSL</title>
    <script>
        fetch('/api/auth-status.php').then(r=>r.json()).then(d=>{
            if (!d.loggedIn) window.location.replace('/index.html');
        });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="page-body">

    <div id="nav-container"></div>

    <main class="page-content">
        <div class="dashboard-header">
            <h1 id="saludo">Hola</h1>
            <h2>Bienvenido a tu portal médico</h2>
        </div>

        <div class="next-appointment-card" id="proxima-cita" style="display:none;">
            <div class="appointment-icon">
                <span class="material-symbols-outlined">calendar_month</span>
            </div>
            <div class="appointment-details">
                <h3 id="cita-cuando">—</h3>
                <p id="cita-detalle">—</p>
            </div>
            <a href="mis-citas.html" class="btn-primary">Ver Detalles</a>
        </div>

        <div class="quick-actions-grid">
            <a href="agendar-cita.html" class="action-card">
                
                <h3>Agendar Cita</h3>
            </a>
            <a href="mis-citas.html" class="action-card">
                
                <h3>Historial de Citas</h3>
            </a>
            <a href="resultados-laboratorio.html" class="action-card">

                <h3>Resultados de Laboratorio</h3>
            </a>
            <a href="mis-recetas.html" class="action-card">

                <h3>Mis Recetas</h3>
            </a>
            
        </div>
    </main>

    <script>
        fetch('nav-user.html').then(r=>r.text()).then(d=>{document.getElementById('nav-container').innerHTML=d;});

        function diasParaCita(fechaStr) {
            const hoy    = new Date(); hoy.setHours(0,0,0,0);
            const fecha  = new Date(fechaStr + 'T00:00:00');
            const diff   = Math.round((fecha - hoy) / 86400000);
            if (diff === 0) return 'Tu cita es hoy';
            if (diff === 1) return 'Tu próxima cita es mañana';
            return `Tu próxima cita es en ${diff} días`;
        }

        function drLabel(g) { return g === 'M' ? 'Dr.' : g === 'F' ? 'Dra.' : 'Dr(a).'; }

        function horaLabel(h) {
            if (!h) return '';
            const [hh, mm] = h.split(':');
            const n = parseInt(hh);
            return `${n > 12 ? n-12 : n || 12}:${mm} ${n >= 12 ? 'PM' : 'AM'}`;
        }

        (async function () {
            const auth = await fetch('/api/auth-status.php').then(r => r.json());
            if (!auth.loggedIn) { window.location.replace('/index.html'); return; }

            document.getElementById('saludo').textContent = 'Hola, ' + auth.nombre;

            if (!auth.id_paciente) return;

            const citas = await fetch(`/api/citas.php?paciente=${auth.id_paciente}`).then(r => r.json());
            const hoy   = new Date().toISOString().split('T')[0];
            const proximas = citas
                .filter(c => c.fecha_cita >= hoy && c.id_estado == 2)
                .sort((a, b) => a.fecha_cita.localeCompare(b.fecha_cita) || a.hora_inicio.localeCompare(b.hora_inicio));

            if (!proximas.length) return;

            const c = proximas[0];
            document.getElementById('cita-cuando').textContent  = diasParaCita(c.fecha_cita);
            document.getElementById('cita-detalle').innerHTML   =
                `<strong>${drLabel(c.genero_medico)} ${c.nombre_medico}</strong> - ${c.nombre_especialidad ?? ''}
                 <span style="margin-left:12px;opacity:.85;">🕐 ${horaLabel(c.hora_inicio)}</span>`;
            document.getElementById('proxima-cita').style.display = 'flex';
        })();
    </script>
</body>
</html>
