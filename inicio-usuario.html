<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>Mi Panel | MediCitas SSL</title>
    <script>
        fetch('/api/auth-status.php').then(r=>r.json()).then(d=>{
            if (!d.loggedIn) window.location.replace('/index.html');
        });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="page-body">

    <div id="nav-container"></div>

    <main class="page-content">
        <div class="dashboard-header">
            <h1>Hola, Victor</h1>
            <h2>Bienvenido a tu portal médico</h2>
        </div>

        <div class="next-appointment-card">
            <div class="appointment-icon">
                
            </div>
            <div class="appointment-details">
                <h3>Tu próxima cita es mañana</h3>
                <p><strong>Dr. Roberto Sánchez</strong> - Cardiología</p>
            </div>
            <a href="mis-citas.html" class="btn-primary">Ver Detalles</a>
        </div>

        <div class="quick-actions-grid">
            <a href="agendar-cita.html" class="action-card">
                
                <h3>Agendar Cita</h3>
            </a>
            <a href="mis-citas.html" class="action-card">
                
                <h3>Historial de Citas</h3>
            </a>
            <a href="#" class="action-card">
                
                <h3>Resultados de Laboratorio</h3>
            </a>
            <a href="#" class="action-card">
                
                <h3>Mis Recetas</h3>
            </a>
            
        </div>
    </main>

    <script>
        fetch('nav-user.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('nav-container').innerHTML = data;
            });
    </script>
</body>
</html>
