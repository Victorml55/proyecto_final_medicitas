<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directorio médico | MediCitas SSL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<div class="proto-shell">
  <div id="nav-container"></div>
  <main>
    <div class="page">

      <div class="page-header">
        <p class="eyebrow">Conoce a tu próximo médico</p>
        <h1>Directorio médico</h1>
        <p id="header-sub">Especialistas certificados del Sanatorio Santa Lucía.</p>
      </div>

      <div class="dir-filters">
        <div class="input-wrap" style="flex:1;">
          <i data-icon="search" class="input-icon"></i>
          <input class="input has-icon" id="buscar" placeholder="Busca por nombre, especialidad o padecimiento">
        </div>
      </div>

      <div class="filter-chips" id="filter-chips">
        <button class="filter-chip" data-active="true" data-spec="all">Todas las especialidades</button>
      </div>

      <div class="grid-2" id="lista-medicos" style="margin-top:24px;">
        <div class="loading-empty" style="grid-column:1/-1;">Cargando médicos...</div>
      </div>

    </div>
  </main>
</div>

<script src="js/utils.js"></script>
<script src="js/icons.js"></script>
<script>
  // Determinar nav según rol (paciente o médico — el directorio sirve a ambos)
  fetch('/api/auth-status.php').then(r => r.json()).then(d => {
    if (d.rol === 'medico') MC.loadNav('nav-medico.html');
    else MC.loadNav('nav-user.html');
  }).catch(() => MC.loadNav('nav-user.html'));

  function calcExp(fechaInicio) {
    if (!fechaInicio) return null;
    const i = new Date(fechaInicio);
    const h = new Date();
    let a = h.getFullYear() - i.getFullYear();
    if (h < new Date(h.getFullYear(), i.getMonth(), i.getDate())) a--;
    return a > 0 ? a : null;
  }

  let TODOS = [];
  let SPEC = 'all';
  let Q = '';

  function render() {
    const filtrados = TODOS.filter(m => {
      if (SPEC !== 'all' && String(m.id_especialidad) !== String(SPEC)) return false;
      if (Q) {
        const q = Q.toLowerCase();
        if (!(`${m.nombre_completo} ${m.nombre_especialidad}`).toLowerCase().includes(q)) return false;
      }
      return true;
    });

    const lista = document.getElementById('lista-medicos');
    if (!filtrados.length) {
      lista.innerHTML = '<div class="loading-empty" style="grid-column:1/-1;">No se encontraron médicos.</div>';
      return;
    }

    lista.innerHTML = filtrados.map(m => {
      const exp = calcExp(m.fecha_inicio);
      const titulo = MC.drLabel(m.genero);
      return `
      <div class="medico-card">
        <div class="medico-head">
          <div class="medico-avatar">${MC.iniciales(m.nombre_completo)}</div>
          <div style="flex:1;min-width:0;">
            <h3 style="font-size:19px;margin-bottom:3px;">${titulo} ${m.nombre_completo}</h3>
            <div class="row" style="gap:8px;margin-bottom:8px;flex-wrap:wrap;">
              <span class="badge primary"><span class="badge-dot"></span>${m.nombre_especialidad || 'Especialista'}</span>
              ${exp !== null ? `<span class="badge success"><span class="badge-dot"></span>${exp} años</span>` : ''}
            </div>
          </div>
        </div>
        <p style="font-size:13px;color:var(--text-2);line-height:1.55;margin-top:14px;">
          ${m.biografia || 'Especialista certificado del Sanatorio Santa Lucía.'}
        </p>
        <div class="row" style="gap:10px;margin-top:16px;">
          <a href="perfil-medico.html?id=${m.id_medico}" class="btn btn-ghost btn-sm" style="flex:1;">
            <i data-icon="eye" data-size="14"></i>Ver perfil
          </a>
          <a href="agendar-cita.html?medico=${m.id_medico}" class="btn btn-primary btn-sm" style="flex:1;">
            Agendar<i data-icon="arrow-right" data-size="14"></i>
          </a>
        </div>
      </div>`;
    }).join('');
    MCIcons.render(lista);
  }

  function renderChips() {
    const especialidades = [...new Set(TODOS.map(m => m.nombre_especialidad).filter(Boolean))];
    const chips = document.getElementById('filter-chips');
    chips.innerHTML = '<button class="filter-chip" data-active="true" data-spec="all">Todas</button>' +
      especialidades.map(e => {
        const id = TODOS.find(m => m.nombre_especialidad === e)?.id_especialidad;
        const count = TODOS.filter(m => m.nombre_especialidad === e).length;
        return `<button class="filter-chip" data-spec="${id}">${e}<span style="opacity:0.6;font-size:12px;">${count}</span></button>`;
      }).join('');
    chips.querySelectorAll('.filter-chip').forEach(c => {
      c.addEventListener('click', () => {
        chips.querySelectorAll('.filter-chip').forEach(x => x.removeAttribute('data-active'));
        c.setAttribute('data-active', 'true');
        SPEC = c.dataset.spec;
        render();
      });
    });
  }

  document.getElementById('buscar').addEventListener('input', e => { Q = e.target.value; render(); });

  (async function () {
    try {
      const data = await fetch('/api/medicos.php').then(r => r.json());
      TODOS = (Array.isArray(data) ? data : []).filter(m => m.activo);
      document.getElementById('header-sub').textContent =
        TODOS.length + ' especialistas certificados en ' + new Set(TODOS.map(m => m.nombre_especialidad)).size + ' áreas.';
      renderChips();
      render();
    } catch (e) {
      document.getElementById('lista-medicos').innerHTML = '<div class="loading-empty" style="grid-column:1/-1;">No se pudo cargar el directorio.</div>';
    }
  })();
</script>

</body>
</html>
