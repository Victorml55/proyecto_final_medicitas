<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>Directorio Médico | MediCitas SSL</title>
    <script>
        fetch('/api/auth-status.php').then(r=>r.json()).then(d=>{
            if (!d.loggedIn) window.location.replace('/index.html');
        });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="cuerpo-pagina">

    <div id="nav-container"></div>

    <main class="contenido-pagina">
        <div class="section-header">
            <h1>Directorio Médico</h1>
            <h2>Conoce a nuestro equipo de especialistas certificados.</h2>
        </div>

        <div class="search-bar-container">
            <span class="material-symbols-outlined search-icon">search</span>
            <input type="text" id="buscador" placeholder="Buscar por nombre o especialidad..." class="search-input" oninput="filtrar(this.value)">
        </div>

        <div class="directory-list" id="directory-list">
            <p style="color:#94a3b8;text-align:center;padding:30px;">Cargando médicos...</p>
        </div>
    </main>

    <script>
        fetch('nav-user.html').then(r=>r.text()).then(d=>{document.getElementById('nav-container').innerHTML=d;});

        let todosMedicos = [];

        function calcularExperiencia(fechaInicio) {
            if (!fechaInicio) return null;
            const inicio = new Date(fechaInicio);
            const hoy = new Date();
            let años = hoy.getFullYear() - inicio.getFullYear();
            if (hoy < new Date(hoy.getFullYear(), inicio.getMonth(), inicio.getDate())) años--;
            return años > 0 ? años : null;
        }

        function renderMedicos(lista) {
            const el = document.getElementById('directory-list');
            if (!lista.length) {
                el.innerHTML = '<p style="color:#94a3b8;text-align:center;padding:30px;">No se encontraron médicos.</p>';
                return;
            }
            el.innerHTML = lista.map(m => {
                const titulo = m.genero === 'M' ? 'Dr.' : m.genero === 'F' ? 'Dra.' : 'Dr(a).';
                const avatar = m.foto_perfil
                    ? `<img src="${m.foto_perfil}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`
                    : `<span class="material-symbols-outlined">person</span>`;
                const exp = calcularExperiencia(m.fecha_inicio);
                return `
                <div class="directory-card">
                    <a href="perfil-medico.html?id=${m.id_medico}" style="display:contents;text-decoration:none;color:inherit;">
                        <div class="doc-avatar" style="cursor:pointer;">${avatar}</div>
                    </a>
                    <div class="doc-info">
                        <h3>
                            <a href="perfil-medico.html?id=${m.id_medico}" style="color:inherit;text-decoration:none;">
                                ${titulo} ${m.nombre_completo}
                            </a>
                        </h3>
                        <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;">
                            <span class="doc-badge" style="margin-bottom:0;">${m.nombre_especialidad}</span>
                            ${exp !== null ? `<span class="doc-badge" style="margin-bottom:0;background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;">${exp} años de experiencia</span>` : ''}
                        </div>
                        <p>${m.biografia ?? 'Especialista certificado del Sanatorio Santa Lucía.'}</p>
                    </div>
                    <div class="doc-action" style="display:flex;flex-direction:column;gap:8px;align-items:stretch;">
                        <a href="perfil-medico.html?id=${m.id_medico}" class="btn-primary" style="background:#f1f5f9;color:#005f99;border:1px solid #bfdbfe;text-align:center;">Ver perfil</a>
                        <a href="agendar-cita.html?medico=${m.id_medico}" class="btn-primary">Agendar Cita</a>
                    </div>
                </div>`;
            }).join('');
        }

        function filtrar(q) {
            const t = q.toLowerCase();
            renderMedicos(todosMedicos.filter(m =>
                m.nombre_completo.toLowerCase().includes(t) ||
                m.nombre_especialidad.toLowerCase().includes(t)
            ));
        }

        (async function () {
            const data = await fetch('/api/medicos.php').then(r => r.json());
            todosMedicos = (Array.isArray(data) ? data : []).filter(m => m.activo);
            renderMedicos(todosMedicos);
        })();
    </script>
</body>
</html>
