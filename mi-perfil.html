<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi perfil | MediCitas SSL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<div class="proto-shell">
  <div id="nav-container"></div>
  <main>
    <div class="page">

      <div class="page-header">
        <p class="eyebrow">Tu información</p>
        <h1>Mi perfil</h1>
        <p>Mantén tu información actualizada para una mejor atención médica.</p>
      </div>

      <div class="profile-layout">
        <aside class="profile-sidebar">
          <div class="profile-photo-wrap">
            <div class="profile-photo" id="profile-ini">??</div>
            <button class="profile-photo-edit" aria-label="Cambiar foto"><i data-icon="plus" data-size="14"></i></button>
          </div>
          <h3 style="font-size:20px;text-align:center;margin-bottom:4px;" id="profile-nombre">Cargando...</h3>
          <p style="text-align:center;font-size:13px;color:var(--text-3);" id="profile-sub">—</p>

          <div class="profile-id">
            <span>EXPEDIENTE</span>
            <strong id="profile-id">—</strong>
          </div>

          <div class="profile-nav">
            <button class="profile-nav-item" data-active="true" data-tab="personal"><i data-icon="user" data-size="16"></i>Datos personales<i data-icon="chevron-right" data-size="14" style="margin-left:auto;opacity:0.5;"></i></button>
            <button class="profile-nav-item" data-tab="salud"><i data-icon="heart-pulse" data-size="16"></i>Información de salud<i data-icon="chevron-right" data-size="14" style="margin-left:auto;opacity:0.5;"></i></button>
            <button class="profile-nav-item" data-tab="contacto"><i data-icon="phone" data-size="16"></i>Contacto de emergencia<i data-icon="chevron-right" data-size="14" style="margin-left:auto;opacity:0.5;"></i></button>
            <button class="profile-nav-item" data-tab="seguridad"><i data-icon="lock" data-size="16"></i>Seguridad<i data-icon="chevron-right" data-size="14" style="margin-left:auto;opacity:0.5;"></i></button>
          </div>

          <div class="divider" style="margin:14px 0;"></div>
          <a href="logout.php" class="btn btn-danger-ghost" style="width:100%;"><i data-icon="log-out"></i>Cerrar sesión</a>
        </aside>

        <div class="profile-main" id="profile-main">
          <div class="card flush profile-card-block">
            <div class="card-head">
              <div class="row" style="gap:10px;"><div class="profile-card-icon"><i data-icon="user" data-size="18"></i></div><h3>Información personal</h3></div>
              <button class="btn btn-soft btn-sm" id="btn-edit-personal">Editar</button>
            </div>
            <div class="card-body">
              <div class="info-grid" id="grid-personal">
                <div class="loading-empty" style="grid-column:1/-1;">Cargando datos...</div>
              </div>
            </div>
          </div>

          <div class="card flush profile-card-block" style="margin-top:18px;">
            <div class="card-head">
              <div class="row" style="gap:10px;"><div class="profile-card-icon"><i data-icon="mail" data-size="18"></i></div><h3>Datos de contacto</h3></div>
              <button class="btn btn-soft btn-sm" id="btn-edit-contacto">Editar</button>
            </div>
            <div class="card-body">
              <div class="info-grid" id="grid-contacto"></div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="js/utils.js"></script>
<script src="js/icons.js"></script>
<script>
  MC.loadNav('nav-user.html');

  (async function () {
    const auth = await MC.requireAuth();
    if (!auth) return;

    try {
      const p = await fetch('/api/perfil.php').then(r => r.json());

      const nombreCompleto = [p.nombre, p.apellido_paterno, p.apellido_materno].filter(Boolean).join(' ');
      document.getElementById('profile-ini').textContent = MC.iniciales(nombreCompleto);
      document.getElementById('profile-nombre').textContent = nombreCompleto;
      document.getElementById('profile-sub').textContent = auth.rol === 'medico' ? 'Médico' : 'Paciente';
      document.getElementById('profile-id').textContent = '#' + (p.id_paciente || p.id_medico || auth.id_usuario);

      const fmt = (iso) => iso ? MC.fechaLarga(iso) : 'No especificado';
      const personal = [
        ['Nombre completo', nombreCompleto],
        ['Fecha de nacimiento', fmt(p.fecha_nacimiento)],
        ['Género', p.genero === 'M' ? 'Masculino' : p.genero === 'F' ? 'Femenino' : (p.genero || 'No especificado')],
        ['Tipo de sangre', p.tipo_sangre || 'No especificado', { highlight: !!p.tipo_sangre }],
      ];
      const contacto = [
        ['Correo electrónico', p.email || '—'],
        ['Teléfono', p.telefono || 'No registrado'],
        ['Dirección', p.direccion || 'No registrada', { full: true }],
      ];

      const renderGrid = (id, items) => {
        document.getElementById(id).innerHTML = items.map(([l, v, opt = {}]) => `
          <div class="info-item${opt.full ? ' full' : ''}">
            <span class="info-label">${l}</span>
            <span class="info-value" ${opt.highlight ? 'data-highlight' : ''}>${v}</span>
          </div>`).join('');
      };
      renderGrid('grid-personal', personal);
      renderGrid('grid-contacto', contacto);

    } catch (e) {
      console.warn('Error perfil', e);
    }
  })();

  // Tabs (placeholder)
  document.querySelectorAll('.profile-nav-item').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.profile-nav-item').forEach(x => x.removeAttribute('data-active'));
      b.setAttribute('data-active', 'true');
      MC.toast('Sección "' + b.textContent.trim() + '" — en desarrollo', 'success');
    });
  });
</script>

</body>
</html>
