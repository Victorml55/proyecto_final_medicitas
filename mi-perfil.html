<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>Mi Perfil | MediCitas SSL</title>
    <script>
        fetch('/api/auth-status.php').then(r=>r.json()).then(d=>{
            if (!d.loggedIn) window.location.replace('/index.html');
        });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="cuerpo-pagina">

    <div id="nav-container"></div>

    <main class="contenido-pagina">
        <div class="section-header" style="text-align: left; margin-bottom: 30px;">
            <h1>Mi Perfil</h1>
            <p>Gestiona tu información personal y médica de forma segura.</p>
        </div>

        <div class="profile-layout">
            
            <aside class="profile-sidebar">
                <div class="profile-avatar-container">
                    <div class="profile-avatar">
                        <span class="material-symbols-outlined">person</span>
                    </div>
                    <button class="btn-edit-avatar">
                        <span class="material-symbols-outlined">photo_camera</span>
                    </button>
                </div>
                <h2 class="profile-name" id="p-nombre">—</h2>
                <p class="profile-id" id="p-expediente">Cargando...</p>
                
                <div class="profile-quick-actions">
                    <button class="btn-outline" style="width: 100%;">Editar Perfil</button>
                    <button class="btn-outline" style="width: 100%; margin-top: 10px;">Cambiar Contraseña</button>
                </div>
            </aside>

            <div class="profile-content">
                
                <div class="profile-card">
                    <div class="card-header">
                        <span class="material-symbols-outlined">badge</span>
                        <h3>Datos Personales</h3>
                    </div>
                    <div class="card-body info-grid">
                        <div class="info-group">
                            <label>Nombre Completo</label>
                            <p id="p-nombre-completo">—</p>
                        </div>
                        <div class="info-group">
                            <label>Fecha de Nacimiento</label>
                            <p id="p-nacimiento">—</p>
                        </div>
                        <div class="info-group">
                            <label>Género</label>
                            <p id="p-genero">—</p>
                        </div>
                        <div class="info-group">
                            <label>Miembro desde</label>
                            <p id="p-registro">—</p>
                        </div>
                    </div>
                </div>

                <div class="profile-card">
                    <div class="card-header">
                        <span class="material-symbols-outlined">contact_mail</span>
                        <h3>Información de Contacto</h3>
                    </div>
                    <div class="card-body info-grid">
                        <div class="info-group">
                            <label>Correo Electrónico</label>
                            <p id="p-email">—</p>
                        </div>
                        <div class="info-group">
                            <label>Teléfono</label>
                            <p id="p-telefono">—</p>
                        </div>
                    </div>
                </div>

                <div class="profile-card">
                    <div class="card-header">
                        <span class="material-symbols-outlined">medical_information</span>
                        <h3>Datos Médicos Básicos</h3>
                    </div>
                    <div class="card-body info-grid">
                        <div class="info-group">
                            <label>Tipo de Sangre</label>
                            <p class="highlight-value" id="p-sangre">—</p>
                        </div>
                        <div class="info-group">
                            <label>Alergias Conocidas</label>
                            <p id="p-alergias">—</p>
                        </div>
                        <div class="info-group" style="grid-column: 1 / -1;">
                            <label>Enfermedades Crónicas</label>
                            <p id="p-cronicas">—</p>
                        </div>
                        <div class="info-group">
                            <label>Contacto de Emergencia</label>
                            <p id="p-emergencia-nombre">—</p>
                        </div>
                        <div class="info-group">
                            <label>Teléfono de Emergencia</label>
                            <p id="p-emergencia-tel">—</p>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        fetch('/api/auth-status.php').then(r=>r.json()).then(auth=>{
            const nav = auth.rol === 'medico' ? 'nav-medico.html' : 'nav-user.html';
            fetch(nav).then(r=>r.text()).then(d=>{document.getElementById('nav-container').innerHTML=d;});
        });

        const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
        const generoMap = { M: 'Masculino', F: 'Femenino', Otro: 'Otro' };

        function edad(fechaStr) {
            if (!fechaStr) return '';
            const hoy = new Date(), nac = new Date(fechaStr);
            let e = hoy.getFullYear() - nac.getFullYear();
            if (hoy < new Date(hoy.getFullYear(), nac.getMonth(), nac.getDate())) e--;
            return e + ' años';
        }

        function formatFecha(f) {
            if (!f) return '—';
            const [y,m,d] = f.split('-');
            return `${parseInt(d)} de ${meses[parseInt(m)-1]} de ${y}`;
        }

        (async function () {
            const p = await fetch('/api/perfil.php').then(r => r.json());
            if (p.error) return;

            const nombre = [p.nombre, p.apellido_paterno, p.apellido_materno].filter(Boolean).join(' ');
            document.getElementById('p-nombre').textContent         = nombre;
            document.getElementById('p-nombre-completo').textContent = nombre;
            document.getElementById('p-expediente').textContent     = p.numero_expediente ? 'Exp: #' + p.numero_expediente : 'Sin expediente asignado';
            document.getElementById('p-nacimiento').textContent     = p.fecha_nacimiento ? formatFecha(p.fecha_nacimiento) + ' (' + edad(p.fecha_nacimiento) + ')' : '—';
            document.getElementById('p-genero').textContent         = generoMap[p.genero] ?? p.genero ?? '—';
            document.getElementById('p-registro').textContent       = p.fecha_registro ? formatFecha(p.fecha_registro.split('T')[0]) : '—';
            document.getElementById('p-email').textContent          = p.email ?? '—';
            document.getElementById('p-telefono').textContent       = p.telefono ?? '—';
            document.getElementById('p-sangre').textContent         = p.tipo_sangre ?? '—';
            document.getElementById('p-alergias').textContent       = p.alergias ?? '—';
            document.getElementById('p-cronicas').textContent       = p.enfermedades_cronicas ?? '—';
            document.getElementById('p-emergencia-nombre').textContent = p.contacto_emergencia_nombre ?? '—';
            document.getElementById('p-emergencia-tel').textContent    = p.contacto_emergencia_telefono ?? '—';
        })();
    </script>
</body>
</html>
