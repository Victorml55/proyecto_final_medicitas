<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <title>Mis Citas | Portal Médico</title>
    <script>
        fetch('/api/auth-status.php').then(r => r.json()).then(d => {
            if (!d.loggedIn || d.rol !== 'medico') window.location.replace('/index.html');
        });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="css/estilo.css">
    <style>
        .appointment-card {
            cursor: pointer;
            transition: box-shadow .2s, transform .15s;
        }
        .appointment-card:hover {
            box-shadow: 0 8px 24px rgba(0,0,0,.08);
            transform: translateY(-2px);
        }

        /* ── Modal paciente ── */
        .modal-pac-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            background: rgba(37,99,235,.07);
            border-radius: 10px;
            margin-bottom: 16px;
        }
        .modal-pac-avatar {
            width: 46px; height: 46px;
            border-radius: 50%;
            background: rgba(148,163,184,.18);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; color: #64748b;
        }
        .modal-pac-nombre { font-weight: 600; font-size: 1rem; color: #0f172a; }
        .modal-detail-row {
            display: flex; align-items: flex-start; gap: 10px;
            color: #475569; font-size: .93rem; padding: 5px 0;
        }
        .modal-detail-row .material-symbols-outlined {
            font-size: 18px; color: #94a3b8; flex-shrink: 0; margin-top: 1px;
        }
        .modal-sep { border: none; border-top: 1px solid #e2e8f0; margin: 14px 0; }

        /* ── Sección concluir ── */
        .sec-title {
            font-size: .77rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: .06em; color: #94a3b8; margin: 14px 0 8px;
        }
        .f-group { margin-bottom: 10px; }
        .f-group label {
            display: block; font-size: .82rem; font-weight: 600;
            color: #475569; margin-bottom: 3px;
        }
        .f-ctrl {
            width: 100%; padding: 8px 10px;
            border: 1px solid #d1d5db; border-radius: 7px;
            font-size: .87rem; color: #1e293b; background: #fff;
            box-sizing: border-box; font-family: inherit;
        }
        .f-ctrl:focus { outline: none; border-color: #3b82f6; }
        textarea.f-ctrl { resize: vertical; min-height: 62px; }

        /* Medicamentos */
        .meds-list { display: flex; flex-direction: column; gap: 8px; }
        .med-row {
            background: #f8fafc; border: 1px solid #e2e8f0;
            border-radius: 8px; padding: 10px 12px;
        }
        .med-row-hdr {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 7px;
        }
        .med-row-lbl { font-size: .8rem; font-weight: 600; color: #64748b; }
        .btn-rm-med {
            background: none; border: none; color: #ef4444;
            cursor: pointer; padding: 0; display: flex; align-items: center;
        }
        .med-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .med-grid .full { grid-column: 1 / -1; }
        .btn-add-med {
            display: flex; align-items: center; gap: 6px;
            background: none; border: 1px dashed #94a3b8;
            color: #64748b; padding: 7px 14px; border-radius: 7px;
            cursor: pointer; font-size: .84rem; font-weight: 500;
            width: 100%; justify-content: center; margin-top: 6px;
            transition: border-color .2s, color .2s;
        }
        .btn-add-med:hover { border-color: #3b82f6; color: #3b82f6; }

        /* Upload */
        .upload-zone {
            border: 1px dashed #94a3b8; border-radius: 8px;
            padding: 14px 16px; background: #f8fafc;
        }
        .upload-zone input[type=file] { display: none; }
        .btn-pick-file {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 7px 14px; border-radius: 7px;
            background: #fff; border: 1px solid #d1d5db;
            color: #475569; cursor: pointer; font-size: .84rem;
            font-weight: 500; transition: border-color .2s;
        }
        .btn-pick-file:hover { border-color: #3b82f6; color: #3b82f6; }
        .file-queue { margin-top: 8px; display: flex; flex-direction: column; gap: 5px; }
        .file-tag {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 10px; border-radius: 6px;
            font-size: .82rem;
            background: #fef9c3; border: 1px solid #fde68a; color: #92400e;
        }
        .file-tag .material-symbols-outlined { font-size: 15px; }
        .file-tag button {
            background: none; border: none; cursor: pointer;
            color: #b45309; padding: 0; margin-left: auto;
            display: flex; align-items: center;
        }

        /* Botón concluir */
        .btn-concluir {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            width: 100%; padding: 11px; margin-top: 14px;
            background: #10b981; color: #fff; border: none;
            border-radius: 8px; font-size: .94rem; font-weight: 600;
            cursor: pointer; transition: background .15s;
        }
        .btn-concluir:hover { background: #059669; }
        .btn-concluir:disabled { opacity: .55; cursor: not-allowed; }

        /* Vista sólo lectura (Concluida) */
        .ro-card {
            background: rgba(37,99,235,.05);
            border: 1px solid rgba(37,99,235,.14);
            border-radius: 10px; padding: 14px 16px; margin-top: 4px;
        }
        .ro-card-title {
            font-weight: 600; font-size: .88rem;
            display: flex; align-items: center; gap: 6px;
            margin-bottom: 10px;
        }
        .ro-card-title.verde { color: #065f46; }
        .ro-card-title.azul  { color: #1e40af; }
        .ro-field { margin-bottom: 7px; font-size: .87rem; }
        .ro-field .lbl {
            font-size: .75rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: .05em; color: #64748b;
        }
        .ro-field .val { color: #1e293b; margin-top: 2px; }
        .med-ro {
            background: #f8fafc; border: 1px solid #e2e8f0;
            border-radius: 7px; padding: 8px 11px; margin-bottom: 5px; font-size: .85rem;
        }
        .med-ro-nm { font-weight: 600; color: #1e293b; }
        .med-ro-dt { color: #64748b; margin-top: 2px; font-size: .82rem; }
        .ind-gen {
            padding: 8px 12px; margin-top: 8px;
            background: rgba(37,99,235,.07);
            border-left: 3px solid #3b82f6; border-radius: 0 6px 6px 0;
            font-size: .85rem; color: #1e293b;
        }
        .res-ro {
            display: flex; align-items: center; gap: 8px;
            padding: 7px 10px; background: #f8fafc;
            border: 1px solid #e2e8f0; border-radius: 7px;
            margin-bottom: 5px; font-size: .84rem;
        }
        .res-ro .material-symbols-outlined { font-size: 17px; color: #94a3b8; flex-shrink: 0; }
        .res-ro a { color: #2563eb; text-decoration: none; font-weight: 500; margin-left: auto; }
        .res-ro a:hover { text-decoration: underline; }
        .empty-ro { font-size: .84rem; color: #94a3b8; padding: 4px 0; }
    </style>
</head>
<body class="cuerpo-pagina">

    <div id="nav-container"></div>

    <main class="contenido-pagina">
        <div class="section-header" style="text-align:left; margin-bottom:40px;">
            <h1>Mis Citas</h1>
            <p>Consulta tu agenda de pacientes.</p>
        </div>

        <h2 class="section-subtitle">Próximas Citas</h2>
        <div class="appointments-list" id="lista-proximas">
            <p style="color:#94a3b8;">Cargando...</p>
        </div>

        <h2 class="section-subtitle" style="margin-top:50px;">Historial</h2>
        <div class="appointments-list" id="lista-historial">
            <p style="color:#94a3b8;">Cargando...</p>
        </div>
    </main>

    <!-- Modal detalle de cita (médico) -->
    <div id="modal-backdrop" class="modal-backdrop" onclick="if(event.target===this)cerrarModal()">
        <div class="modal" style="max-width:600px;">
            <div class="modal-header">
                <h3>Detalle de la cita</h3>
                <button class="modal-close" onclick="cerrarModal()">×</button>
            </div>
            <div class="modal-body" id="modal-cuerpo"></div>
            <div class="modal-footer">
                <button onclick="cerrarModal()"
                        style="padding:8px 22px;border-radius:8px;border:2px solid #005f99;background:white;color:#005f99;font-size:.9rem;font-weight:600;cursor:pointer;">
                    Cerrar
                </button>
            </div>
        </div>
    </div>

    <script>
        fetch('nav-medico.html').then(r => r.text()).then(d => {
            document.getElementById('nav-container').innerHTML = d;
        });

        const mesesC = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
        const mesesL = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto',
                        'septiembre','octubre','noviembre','diciembre'];
        let todasCitas  = [];
        let citaActual  = null;
        let archivosQ   = [];   // cola de archivos pendientes de subir
        let medCounter  = 0;

        function horaLabel(h) {
            if (!h) return '—';
            const [hh, mm] = h.split(':');
            const n = parseInt(hh);
            return `${n > 12 ? n-12 : n || 12}:${mm} ${n >= 12 ? 'PM' : 'AM'}`;
        }

        // ── Tarjeta de cita ──────────────────────────────────────────────────
        function tarjetaCita(c, futura) {
            const f   = c.fecha_cita.split('T')[0].split('-');
            const mes = mesesC[parseInt(f[1])-1].toUpperCase();
            const col = c.color || '#94a3b8';
            return `
            <div class="appointment-card ${futura ? '' : 'past-appointment'}"
                 onclick="abrirModal(${c.id_cita})">
                <div class="date-block">
                    <span class="date-month">${mes}</span>
                    <span class="date-day">${parseInt(f[2])}</span>
                    <span class="date-year">${f[0]}</span>
                </div>
                <div class="appointment-info">
                    <div class="appointment-header">
                        <h3>${c.nombre_paciente}</h3>
                        <span class="status-badge" style="background:${col}22;color:${col};">${c.nombre_estado}</span>
                    </div>
                    <div class="appointment-meta">
                        <span><span class="material-symbols-outlined">schedule</span> ${horaLabel(c.hora_inicio)}</span>
                        ${c.numero_consultorio ? `<span><span class="material-symbols-outlined">meeting_room</span> Consultorio ${c.numero_consultorio}</span>` : ''}
                        ${c.motivo_consulta    ? `<span><span class="material-symbols-outlined">description</span> ${c.motivo_consulta}</span>` : ''}
                    </div>
                </div>
                <div style="padding-left:8px;flex-shrink:0;">
                    <span class="material-symbols-outlined" style="color:#94a3b8;font-size:20px;">chevron_right</span>
                </div>
            </div>`;
        }

        // ── Cargar citas ────────────────────────────────────────────────────
        async function cargarCitas() {
            const auth = await fetch('/api/auth-status.php').then(r => r.json());
            if (!auth.loggedIn || auth.rol !== 'medico') {
                window.location.replace('/index.html'); return;
            }

            const citas = await fetch(`/api/citas.php?medico=${auth.id_medico}`).then(r => r.json());
            todasCitas  = citas;
            const hoy   = new Date().toISOString().split('T')[0];

            const terminada = c => ['Cancelada','Rechazada','Concluida'].includes(c.nombre_estado);
            const proximas  = citas.filter(c => c.fecha_cita >= hoy && !terminada(c))
                                   .sort((a,b) => a.fecha_cita.localeCompare(b.fecha_cita) || a.hora_inicio.localeCompare(b.hora_inicio));
            const historial = citas.filter(c => c.fecha_cita < hoy || terminada(c))
                                   .sort((a,b) => b.fecha_cita.localeCompare(a.fecha_cita));

            const elP = document.getElementById('lista-proximas');
            const elH = document.getElementById('lista-historial');

            elP.innerHTML = proximas.length
                ? proximas.map(c => tarjetaCita(c, true)).join('')
                : '<p style="color:#94a3b8;padding:20px 0;">No tienes citas próximas.</p>';
            elH.innerHTML = historial.length
                ? historial.map(c => tarjetaCita(c, false)).join('')
                : '<p style="color:#94a3b8;padding:20px 0;">Sin historial de citas.</p>';
        }

        // ── Modal ───────────────────────────────────────────────────────────
        async function abrirModal(idCita) {
            const c = todasCitas.find(x => x.id_cita === idCita);
            if (!c) return;
            citaActual = c;
            archivosQ  = [];
            medCounter = 0;

            const f      = c.fecha_cita.split('T')[0].split('-');
            const fecha  = `${parseInt(f[2])} de ${mesesL[parseInt(f[1])-1]} de ${f[0]}`;
            const col    = c.color || '#94a3b8';

            let html = `
                <div class="modal-pac-row">
                    <div class="modal-pac-avatar">
                        <span class="material-symbols-outlined" style="font-size:26px;">person</span>
                    </div>
                    <div style="flex:1;">
                        <div class="modal-pac-nombre">${c.nombre_paciente}</div>
                        <div style="font-size:.83rem;color:#64748b;margin-top:1px;">Paciente</div>
                    </div>
                    <span class="status-badge" style="background:${col}22;color:${col};">${c.nombre_estado}</span>
                </div>
                <div class="modal-detail-row">
                    <span class="material-symbols-outlined">calendar_today</span>
                    <span>${fecha}</span>
                </div>
                <div class="modal-detail-row">
                    <span class="material-symbols-outlined">schedule</span>
                    <span>${horaLabel(c.hora_inicio)}</span>
                </div>
                ${c.numero_consultorio ? `<div class="modal-detail-row">
                    <span class="material-symbols-outlined">meeting_room</span>
                    <span>Consultorio ${c.numero_consultorio}</span>
                </div>` : ''}
                ${c.motivo_consulta ? `<div class="modal-detail-row">
                    <span class="material-symbols-outlined">description</span>
                    <span>${c.motivo_consulta}</span>
                </div>` : ''}`;

            if (c.nombre_estado === 'Confirmada') {
                html += htmlFormConcluir();
            } else if (c.nombre_estado === 'Concluida') {
                html += '<hr class="modal-sep">';
                html += await htmlRecetaRO(idCita);
                html += await htmlResultadosRO(idCita);
            } else {
                html += `<hr class="modal-sep"><p style="font-size:.87rem;color:#94a3b8;">
                    Estado actual: <strong>${c.nombre_estado}</strong>. No hay acciones disponibles.</p>`;
            }

            document.getElementById('modal-cuerpo').innerHTML = html;
            document.getElementById('modal-backdrop').classList.add('active');
        }

        function cerrarModal() {
            document.getElementById('modal-backdrop').classList.remove('active');
            citaActual = null;
            archivosQ  = [];
        }

        // ── Formulario concluir ─────────────────────────────────────────────
        function htmlFormConcluir() {
            return `
            <hr class="modal-sep">
            <div class="sec-title">Diagnóstico y Receta
                <span style="font-weight:400;text-transform:none;letter-spacing:0;color:#94a3b8;font-size:.73rem;"> — opcional</span>
            </div>
            <div class="f-group">
                <label for="f-diag">Diagnóstico</label>
                <textarea id="f-diag" class="f-ctrl" rows="2" placeholder="Ej. Hipertensión arterial leve..."></textarea>
            </div>
            <div class="f-group">
                <label for="f-ind">Indicaciones generales</label>
                <textarea id="f-ind" class="f-ctrl" rows="2" placeholder="Ej. Reposar, tomar abundante agua..."></textarea>
            </div>

            <div class="sec-title">Medicamentos</div>
            <div id="meds-list" class="meds-list"></div>
            <button type="button" class="btn-add-med" onclick="agregarMed()">
                <span class="material-symbols-outlined" style="font-size:17px;">add</span>
                Agregar medicamento
            </button>

            <div class="sec-title" style="margin-top:14px;">Resultados de Laboratorio
                <span style="font-weight:400;text-transform:none;letter-spacing:0;color:#94a3b8;font-size:.73rem;"> — opcional</span>
            </div>
            <div class="upload-zone">
                <div style="font-size:.82rem;color:#64748b;margin-bottom:8px;text-align:center;">
                    <span class="material-symbols-outlined" style="font-size:28px;color:#94a3b8;display:block;margin-bottom:4px;">upload_file</span>
                    PDF, imágenes, Word, Excel — máx. 10 MB por archivo
                </div>
                <div class="f-group" style="margin-bottom:8px;">
                    <input type="text" id="f-arc-desc" class="f-ctrl"
                           placeholder="Descripción del archivo (opcional)"
                           style="max-width:340px;display:block;margin:0 auto;">
                </div>
                <div style="text-align:center;">
                    <label class="btn-pick-file">
                        <span class="material-symbols-outlined" style="font-size:16px;">attach_file</span>
                        Seleccionar archivo
                        <input type="file" id="f-archivo"
                               accept=".pdf,.jpg,.jpeg,.png,.gif,.doc,.docx,.xls,.xlsx"
                               onchange="archivoSeleccionado(this)">
                    </label>
                </div>
            </div>
            <div id="file-queue" class="file-queue"></div>

            <button class="btn-concluir" id="btn-concluir" onclick="guardarYConcluir()">
                <span class="material-symbols-outlined" style="font-size:18px;">task_alt</span>
                Guardar y marcar como Concluida
            </button>`;
        }

        function agregarMed() {
            medCounter++;
            const id  = medCounter;
            const row = document.createElement('div');
            row.className = 'med-row';
            row.id = 'med-' + id;
            row.innerHTML = `
                <div class="med-row-hdr">
                    <span class="med-row-lbl">Medicamento ${id}</span>
                    <button type="button" class="btn-rm-med" onclick="quitarMed(${id})">
                        <span class="material-symbols-outlined" style="font-size:18px;">close</span>
                    </button>
                </div>
                <div class="med-grid">
                    <div class="full">
                        <label>Nombre <span style="color:#ef4444">*</span></label>
                        <input type="text" class="f-ctrl" data-med="${id}" data-f="nombre" placeholder="Ej. Paracetamol">
                    </div>
                    <div>
                        <label>Presentación</label>
                        <input type="text" class="f-ctrl" data-med="${id}" data-f="presentacion" placeholder="Ej. 500 mg">
                    </div>
                    <div>
                        <label>Dosis <span style="color:#ef4444">*</span></label>
                        <input type="text" class="f-ctrl" data-med="${id}" data-f="dosis" placeholder="Ej. 1 tableta">
                    </div>
                    <div>
                        <label>Frecuencia <span style="color:#ef4444">*</span></label>
                        <input type="text" class="f-ctrl" data-med="${id}" data-f="frecuencia" placeholder="Ej. Cada 8 h">
                    </div>
                    <div>
                        <label>Duración</label>
                        <input type="text" class="f-ctrl" data-med="${id}" data-f="duracion" placeholder="Ej. 7 días">
                    </div>
                    <div class="full">
                        <label>Indicaciones adicionales</label>
                        <input type="text" class="f-ctrl" data-med="${id}" data-f="indicaciones" placeholder="Ej. Tomar con alimentos">
                    </div>
                </div>`;
            document.getElementById('meds-list').appendChild(row);
        }

        function quitarMed(id) {
            const el = document.getElementById('med-' + id);
            if (el) el.remove();
        }

        function archivoSeleccionado(input) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];
            const desc = document.getElementById('f-arc-desc').value.trim();

            const idx = archivosQ.length;
            archivosQ.push({ file, desc });

            const tag = document.createElement('div');
            tag.className = 'file-tag';
            tag.id = 'ftag-' + idx;
            tag.innerHTML = `
                <span class="material-symbols-outlined">attach_file</span>
                <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${file.name}</span>
                ${desc ? `<span style="font-style:italic;opacity:.75;">${desc}</span>` : ''}
                <button type="button" onclick="quitarArchivo(${idx})">
                    <span class="material-symbols-outlined" style="font-size:15px;">close</span>
                </button>`;
            document.getElementById('file-queue').appendChild(tag);

            input.value = '';
            document.getElementById('f-arc-desc').value = '';
        }

        function quitarArchivo(idx) {
            archivosQ[idx] = null;
            const el = document.getElementById('ftag-' + idx);
            if (el) el.remove();
        }

        function getMeds() {
            const meds = [];
            document.querySelectorAll('.med-row').forEach(row => {
                const id  = row.id.replace('med-', '');
                const get = f => (row.querySelector(`[data-med="${id}"][data-f="${f}"]`)?.value.trim() || '');
                if (!get('nombre')) return;
                meds.push({
                    nombre_medicamento: get('nombre'),
                    presentacion:       get('presentacion') || null,
                    dosis:              get('dosis')        || '—',
                    frecuencia:         get('frecuencia')   || '—',
                    duracion:           get('duracion')     || null,
                    indicaciones:       get('indicaciones') || null,
                });
            });
            return meds;
        }

        async function guardarYConcluir() {
            const btn = document.getElementById('btn-concluir');
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:18px;">hourglass_top</span> Guardando...';

            try {
                // 1. Subir archivos primero
                for (const entry of archivosQ) {
                    if (!entry) continue;
                    const fd = new FormData();
                    fd.append('id_cita',     citaActual.id_cita);
                    fd.append('descripcion', entry.desc || '');
                    fd.append('archivo',     entry.file);
                    const r = await fetch('/api/resultados.php', { method: 'POST', body: fd });
                    if (!r.ok) {
                        const e = await r.json().catch(() => ({}));
                        throw new Error(e.error ?? 'Error al subir ' + entry.file.name);
                    }
                }

                // 2. Concluir cita + receta
                const payload = {
                    diagnostico:            document.getElementById('f-diag')?.value.trim() || null,
                    indicaciones_generales: document.getElementById('f-ind')?.value.trim()  || null,
                    medicamentos:           getMeds(),
                };

                const r2 = await fetch(`/api/citas.php?id=${citaActual.id_cita}&accion=concluir`, {
                    method:  'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify(payload),
                });

                if (!r2.ok) {
                    const e = await r2.json().catch(() => ({}));
                    throw new Error(e.error ?? 'No se pudo concluir la cita');
                }

                cerrarModal();
                cargarCitas();

            } catch (err) {
                alert(err.message);
                btn.disabled = false;
                btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:18px;">task_alt</span> Guardar y marcar como Concluida';
            }
        }

        // ── Vista de sólo lectura ──────────────────────────────────────────
        async function htmlRecetaRO(idCita) {
            try {
                const receta = await fetch(`/api/recetas.php?id_cita=${idCita}`).then(r => r.json());
                if (!receta) {
                    return `<div class="ro-card">
                        <div class="ro-card-title azul">
                            <span class="material-symbols-outlined" style="font-size:18px;">medication</span>Receta
                        </div>
                        <p class="empty-ro">Sin receta registrada para esta consulta.</p>
                    </div>`;
                }

                const meds = receta.medicamentos ?? [];
                const medsHtml = meds.map(m => `
                    <div class="med-ro">
                        <div class="med-ro-nm">${m.nombre_medicamento}${m.presentacion ? ` <span style="font-weight:400;color:#64748b;font-size:.8rem;">${m.presentacion}</span>` : ''}</div>
                        <div class="med-ro-dt">${m.dosis} · ${m.frecuencia}${m.duracion ? ' · ' + m.duracion : ''}</div>
                        ${m.indicaciones ? `<div style="font-style:italic;color:#94a3b8;font-size:.8rem;margin-top:2px;">${m.indicaciones}</div>` : ''}
                    </div>`).join('');

                return `<div class="ro-card">
                    <div class="ro-card-title azul">
                        <span class="material-symbols-outlined" style="font-size:18px;">medication</span>Receta
                    </div>
                    ${receta.diagnostico ? `<div class="ro-field"><div class="lbl">Diagnóstico</div><div class="val">${receta.diagnostico}</div></div>` : ''}
                    ${meds.length ? medsHtml : '<p class="empty-ro">Sin medicamentos.</p>'}
                    ${receta.indicaciones_generales ? `<div class="ind-gen"><strong>Indicaciones generales:</strong> ${receta.indicaciones_generales}</div>` : ''}
                </div>`;
            } catch { return ''; }
        }

        async function htmlResultadosRO(idCita) {
            try {
                const archivos = await fetch(`/api/resultados.php?id_cita=${idCita}`).then(r => r.json());
                if (!Array.isArray(archivos) || !archivos.length) {
                    return `<div class="ro-card" style="margin-top:10px;">
                        <div class="ro-card-title verde">
                            <span class="material-symbols-outlined" style="font-size:18px;">lab_panel</span>Resultados de Laboratorio
                        </div>
                        <p class="empty-ro">Sin resultados subidos para esta consulta.</p>
                    </div>`;
                }

                const items = archivos.map(a => `
                    <div class="res-ro">
                        <span class="material-symbols-outlined">description</span>
                        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${a.nombre_archivo}</span>
                        ${a.descripcion ? `<span style="color:#64748b;font-style:italic;font-size:.8rem;">${a.descripcion}</span>` : ''}
                        <a href="/api/descargar-resultado.php?id=${a.id_archivo}" target="_blank">
                            <span class="material-symbols-outlined" style="font-size:18px;">download</span>
                        </a>
                    </div>`).join('');

                return `<div class="ro-card" style="margin-top:10px;">
                    <div class="ro-card-title verde">
                        <span class="material-symbols-outlined" style="font-size:18px;">lab_panel</span>Resultados de Laboratorio
                    </div>
                    ${items}
                </div>`;
            } catch { return ''; }
        }

        cargarCitas();
    </script>
</body>
</html>
