<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi agenda | Portal médico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<div class="proto-shell">
  <div id="nav-container"></div>
  <main>
    <div class="page">

      <div class="page-header row between">
        <div>
          <p class="eyebrow" id="header-fecha">Cargando...</p>
          <h1>Mi agenda</h1>
          <p id="header-sub">—</p>
        </div>
        <div class="view-toggle">
          <button data-view="week" data-active="true">Semana</button>
          <button data-view="list">Lista</button>
        </div>
      </div>

      <div id="view-content">
        <div class="loading-empty">Cargando agenda...</div>
      </div>

    </div>
  </main>
</div>

<script src="js/utils.js"></script>
<script src="js/icons.js"></script>
<script>
  MC.loadNav('nav-medico.html');

  let CITAS = [];
  let VIEW = 'week';
  let TAB = 'proximas';

  function renderWeek() {
    const inicio = new Date(); inicio.setDate(inicio.getDate() - inicio.getDay() + 1);
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(inicio); d.setDate(inicio.getDate() + i);
      const iso = d.toISOString().split('T')[0];
      const dia = d.toLocaleDateString('es', { weekday: 'short' }).toUpperCase().slice(0,3);
      const citasDia = CITAS.filter(c => c.fecha_cita === iso).sort((a,b) => a.hora_inicio.localeCompare(b.hora_inicio));
      days.push({ iso, day: d.getDate(), dia, citas: citasDia });
    }

    document.getElementById('view-content').innerHTML = `
      <div class="card flush">
        <div class="card-head">
          <div class="row" style="gap:10px;">
            <button class="btn btn-ghost btn-sm"><i data-icon="chevron-left" data-size="14"></i></button>
            <h3>Semana actual</h3>
            <button class="btn btn-ghost btn-sm"><i data-icon="chevron-right" data-size="14"></i></button>
          </div>
        </div>
        <div class="week-grid">
          ${days.map(d => `
            <div class="week-col" data-empty="${d.citas.length === 0}">
              <div class="week-col-head">
                <span class="week-day-name">${d.dia}</span>
                <span class="week-day-num">${d.day}</span>
                <span class="week-day-count">${d.citas.length > 0 ? d.citas.length + ' citas' : 'Sin citas'}</span>
              </div>
              <div class="week-col-body">
                ${d.citas.slice(0, 4).map(c => `
                  <div class="week-appt" data-status="${c.id_estado == 3 ? 'done' : 'upcoming'}">
                    <strong>${MC.horaLabel(c.hora_inicio)}</strong>
                    <span class="week-appt-patient">${c.nombre_paciente || 'Paciente'}</span>
                    <span class="week-appt-reason">${c.motivo_consulta || 'Consulta'}</span>
                  </div>
                `).join('')}
                ${d.citas.length > 4 ? `<div class="week-more">+ ${d.citas.length - 4} más</div>` : ''}
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
    MCIcons.render(document.getElementById('view-content'));
  }

  function renderList() {
    const hoyISO = new Date().toISOString().split('T')[0];
    const proximas = CITAS.filter(c => c.fecha_cita >= hoyISO && c.id_estado != 3 && c.id_estado != 4);
    const pasadas  = CITAS.filter(c => c.fecha_cita <  hoyISO || c.id_estado == 3 || c.id_estado == 4);
    const items = TAB === 'proximas' ? proximas : pasadas;

    document.getElementById('view-content').innerHTML = `
      <div class="row between" style="margin-bottom:22px;">
        <div class="tabs">
          <button class="tab" data-tab="proximas" ${TAB==='proximas'?'data-active="true"':''}>
            Próximas <span class="tab-count">${proximas.length}</span>
          </button>
          <button class="tab" data-tab="pasadas" ${TAB==='pasadas'?'data-active="true"':''}>
            Pasadas <span class="tab-count">${pasadas.length}</span>
          </button>
        </div>
      </div>
      <div class="stack">
        ${items.length === 0 ? '<div class="loading-empty">Sin citas en esta vista.</div>' : items.map(c => {
          const f = MC.fechaCorta(c.fecha_cita);
          return `
          <div class="appt-row">
            <div class="appt-date">
              <div class="appt-day-name">${f.month}</div>
              <div class="appt-day">${f.day}</div>
              <div class="appt-month">${MC.horaLabel(c.hora_inicio)}</div>
            </div>
            <div class="appt-body">
              <div class="row" style="gap:10px;margin-bottom:6px;">
                <h3 style="font-size:17px;">${c.nombre_paciente || 'Paciente'}</h3>
                ${c.id_estado == 1 ? '<span class="badge warning"><span class="badge-dot"></span>Pendiente</span>' :
                  c.id_estado == 2 ? '<span class="badge success"><span class="badge-dot"></span>Confirmada</span>' :
                  c.id_estado == 3 ? '<span class="badge muted"><span class="badge-dot"></span>Atendido</span>' : ''}
              </div>
              <div style="color:var(--text-2);font-size:14px;">${c.motivo_consulta || 'Consulta'}</div>
            </div>
            <div class="appt-actions">
              ${c.id_estado == 3
                ? '<button class="btn btn-ghost btn-sm"><i data-icon="file-text"></i>Ver notas</button>'
                : '<button class="btn btn-primary btn-sm">Ver ficha<i data-icon="arrow-right" data-size="14"></i></button>'}
            </div>
          </div>`;
        }).join('')}
      </div>`;
    MCIcons.render(document.getElementById('view-content'));
    document.querySelectorAll('.tab[data-tab]').forEach(t => {
      t.addEventListener('click', () => { TAB = t.dataset.tab; renderList(); });
    });
  }

  function render() {
    VIEW === 'week' ? renderWeek() : renderList();
  }

  document.querySelectorAll('.view-toggle button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.view-toggle button').forEach(x => x.removeAttribute('data-active'));
      b.setAttribute('data-active', 'true');
      VIEW = b.dataset.view;
      render();
    });
  });

  (async function () {
    const auth = await MC.requireAuth('medico');
    if (!auth) return;
    document.getElementById('header-fecha').textContent = MC.fechaLarga(new Date().toISOString().split('T')[0]);
    try {
      CITAS = await fetch('/api/citas.php?medico=' + auth.id_medico).then(r => r.json()) || [];
      document.getElementById('header-sub').textContent = CITAS.length + ' consultas en total.';
      render();
    } catch (e) {
      document.getElementById('view-content').innerHTML = '<div class="loading-empty">No se pudo cargar la agenda.</div>';
    }
  })();
</script>

</body>
</html>
