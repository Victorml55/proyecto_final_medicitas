<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>Mis citas | MediCitas SSL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<div class="proto-shell">
  <div id="nav-container"></div>
  <main>
    <div class="page">

      <div class="page-header row between">
        <div>
          <p class="eyebrow">Tu agenda</p>
          <h1>Mis citas</h1>
          <p>Gestiona tus consultas, reagenda o agrega una nueva.</p>
        </div>
        <a href="agendar-cita.html" class="btn btn-primary btn-lg">
          <i data-icon="plus"></i>Agendar nueva
        </a>
      </div>

      <div class="row between" style="margin-bottom:22px;">
        <div class="tabs">
          <button class="tab" data-active="true" data-tab="proximas">
            Próximas <span class="tab-count" id="count-proximas">0</span>
          </button>
          <button class="tab" data-tab="pasadas">
            Pasadas <span class="tab-count" id="count-pasadas">0</span>
          </button>
        </div>
        <div class="row" style="gap:10px;">
          <div class="input-wrap" style="width:260px;">
            <i data-icon="search" class="input-icon"></i>
            <input class="input has-icon" id="buscar" placeholder="Buscar médico o motivo">
          </div>
        </div>
      </div>

      <div class="stack" id="lista-citas">
        <div class="loading-empty">Cargando citas...</div>
      </div>

    </div>
  </main>
</div>

<script src="js/utils.js"></script>
<script src="js/icons.js"></script>
<script>
  MC.loadNav('nav-user.html');

  let TODAS = [];
  let TAB = 'proximas';
  let Q = '';

  function render() {
    const hoy = new Date().toISOString().split('T')[0];
    const filtradas = TODAS.filter(c => {
      if (TAB === 'proximas') {
        if (c.fecha_cita < hoy || c.id_estado == 3 || c.id_estado == 4) return false;
      } else {
        if (c.fecha_cita >= hoy && c.id_estado != 3 && c.id_estado != 4) return false;
      }
      if (Q) {
        const q = Q.toLowerCase();
        const blob = `${c.nombre_medico || ''} ${c.nombre_especialidad || ''} ${c.motivo_consulta || ''}`.toLowerCase();
        if (!blob.includes(q)) return false;
      }
      return true;
    });

    document.getElementById('count-proximas').textContent =
      TODAS.filter(c => c.fecha_cita >= hoy && c.id_estado != 3 && c.id_estado != 4).length;
    document.getElementById('count-pasadas').textContent =
      TODAS.filter(c => c.fecha_cita < hoy || c.id_estado == 3 || c.id_estado == 4).length;

    const lista = document.getElementById('lista-citas');
    if (!filtradas.length) {
      lista.innerHTML = `
        <div class="card" style="text-align:center;padding:60px 20px;">
          <i data-icon="calendar" data-size="32" style="color:var(--text-3);margin-bottom:12px;"></i>
          <h3 style="font-size:18px;margin-bottom:6px;">No tienes citas ${TAB}</h3>
          <p style="color:var(--text-2);">Reserva una consulta cuando lo necesites.</p>
        </div>`;
      MCIcons.render(lista);
      return;
    }

    lista.innerHTML = filtradas.map(c => {
      const f = MC.fechaCorta(c.fecha_cita);
      const dia = new Date(c.fecha_cita + 'T00:00:00').toLocaleDateString('es', { weekday: 'short' }).toUpperCase().slice(0,3);

      const statusBadge =
        c.id_estado == 1 ? '<span class="badge warning"><span class="badge-dot"></span>Pendiente de confirmación</span>' :
        c.id_estado == 2 ? '<span class="badge success"><span class="badge-dot"></span>Confirmada</span>' :
        c.id_estado == 3 ? '<span class="badge muted"><span class="badge-dot"></span>Completada</span>' :
        c.id_estado == 4 ? '<span class="badge danger"><span class="badge-dot"></span>Cancelada</span>' : '';

      const actions = TAB === 'proximas'
        ? `<button class="btn btn-soft btn-sm">Reprogramar</button>
           <button class="btn btn-danger-ghost btn-sm" data-cancel="${c.id_cita}">Cancelar</button>`
        : `<a href="calificar-cita.html?id=${c.id_cita}" class="btn btn-soft btn-sm"><i data-icon="star"></i>Calificar</a>
           <button class="btn btn-ghost btn-sm"><i data-icon="file-text"></i>Ver receta</button>`;

      return `
      <div class="appt-row">
        <div class="appt-date">
          <div class="appt-day-name">${dia}</div>
          <div class="appt-day">${f.day}</div>
          <div class="appt-month">${f.month} ${String(f.year).slice(2)}</div>
        </div>
        <div class="appt-body">
          <div class="row" style="gap:10px;margin-bottom:6px;">
            <h3 style="font-size:18px;">${MC.drLabel(c.genero_medico)} ${c.nombre_medico || ''}</h3>
            ${statusBadge}
          </div>
          <div style="color:var(--text-2);font-size:14px;margin-bottom:10px;">
            ${c.nombre_especialidad || ''} · ${c.motivo_consulta || 'Consulta general'}
          </div>
          <div class="appt-meta">
            <span><i data-icon="clock" data-size="14"></i> ${MC.horaLabel(c.hora_inicio)}</span>
            <span><i data-icon="map-pin" data-size="14"></i> ${c.consultorio || 'Consultorio'}</span>
          </div>
        </div>
        <div class="appt-actions">${actions}</div>
      </div>`;
    }).join('');
    MCIcons.render(lista);
  }

  document.querySelectorAll('.tab[data-tab]').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab[data-tab]').forEach(x => x.removeAttribute('data-active'));
      t.setAttribute('data-active', 'true');
      TAB = t.dataset.tab;
      render();
    });
  });
  document.getElementById('buscar').addEventListener('input', e => { Q = e.target.value; render(); });

  (async function () {
    const auth = await MC.requireAuth();
    if (!auth || !auth.id_paciente) return;
    try {
      TODAS = await fetch('/api/citas.php?paciente=' + auth.id_paciente).then(r => r.json()) || [];
      render();
    } catch (e) {
      document.getElementById('lista-citas').innerHTML =
        '<div class="loading-empty">No se pudieron cargar tus citas.</div>';
    }
  })();
</script>

</body>
</html>
