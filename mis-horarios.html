<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis horarios | Portal médico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<div class="proto-shell">
  <div id="nav-container"></div>
  <main>
    <div class="page" style="max-width:900px;">

      <div class="page-header">
        <p class="eyebrow">Tu disponibilidad</p>
        <h1>Mis horarios</h1>
        <p>Define los días y horas en que atiendes pacientes. Esto controla cuándo pueden agendar contigo.</p>
      </div>

      <div class="grid-3" style="margin-bottom:28px;">
        <div class="stat-card" data-tone="primary">
          <div class="stat-head"><div class="stat-icon"><i data-icon="calendar" data-size="18"></i></div></div>
          <div class="stat-n" id="stat-dias">—</div>
          <div class="stat-label">Días activos por semana</div>
        </div>
        <div class="stat-card" data-tone="warm">
          <div class="stat-head"><div class="stat-icon"><i data-icon="clock" data-size="18"></i></div></div>
          <div class="stat-n" id="stat-horas">—h</div>
          <div class="stat-label">Horas semanales de atención</div>
        </div>
        <div class="stat-card" data-tone="success">
          <div class="stat-head"><div class="stat-icon"><i data-icon="users" data-size="18"></i></div></div>
          <div class="stat-n" id="stat-citas">—</div>
          <div class="stat-label">Citas semanales estimadas</div>
        </div>
      </div>

      <div class="card flush">
        <div class="card-head">
          <h3>Horario semanal</h3>
          <button class="btn btn-soft btn-sm" id="btn-guardar"><i data-icon="check"></i>Guardar cambios</button>
        </div>
        <div class="schedule-list" id="schedule-list">
          <div class="loading-empty">Cargando horarios...</div>
        </div>
      </div>

      <div class="alert alert-success" id="msg-ok" style="margin-top:18px;"></div>
      <div class="alert alert-error"   id="msg-err" style="margin-top:18px;"></div>

    </div>
  </main>
</div>

<script src="js/utils.js"></script>
<script src="js/icons.js"></script>
<script>
  MC.loadNav('nav-medico.html');

  const DIAS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  const estado = {};
  DIAS.forEach(d => estado[d] = { activo: false, ini: '08:00', fin: '17:00' });

  function actualizarStats() {
    let dias = 0, horas = 0;
    DIAS.forEach(d => {
      if (!estado[d].activo) return;
      dias++;
      const [hi, mi] = estado[d].ini.split(':').map(Number);
      const [hf, mf] = estado[d].fin.split(':').map(Number);
      horas += (hf*60 + mf - hi*60 - mi) / 60;
    });
    document.getElementById('stat-dias').textContent = dias;
    document.getElementById('stat-horas').textContent = horas.toFixed(0) + 'h';
    document.getElementById('stat-citas').textContent = '~' + Math.round(horas * 1.5);
  }

  function render() {
    const list = document.getElementById('schedule-list');
    list.innerHTML = DIAS.map(d => {
      const s = estado[d];
      const [hi, mi] = s.ini.split(':').map(Number);
      const [hf, mf] = s.fin.split(':').map(Number);
      const dur = ((hf*60 + mf - hi*60 - mi) / 60).toFixed(1).replace('.0', '');
      return `
      <div class="schedule-row" data-active="${s.activo}" data-d="${d}">
        <div class="schedule-day">
          <strong>${d}</strong>
          <span>${s.activo ? 'Disponible' : 'No disponible'}</span>
        </div>
        <button class="schedule-toggle" data-on="${s.activo}" data-toggle="${d}"><span></span></button>
        <div class="schedule-times" data-disabled="${!s.activo}">
          <div class="schedule-time">
            <label>Entrada</label>
            <input type="time" value="${s.ini}" data-time="ini" data-d="${d}" ${s.activo ? '' : 'disabled'}>
          </div>
          <div class="schedule-arrow">→</div>
          <div class="schedule-time">
            <label>Salida</label>
            <input type="time" value="${s.fin}" data-time="fin" data-d="${d}" ${s.activo ? '' : 'disabled'}>
          </div>
          <div class="schedule-duration">${s.activo ? dur + ' h' : '—'}</div>
        </div>
      </div>`;
    }).join('');
    list.querySelectorAll('[data-toggle]').forEach(b => {
      b.addEventListener('click', () => {
        const d = b.dataset.toggle;
        estado[d].activo = !estado[d].activo;
        render(); actualizarStats();
      });
    });
    list.querySelectorAll('input[data-time]').forEach(inp => {
      inp.addEventListener('change', () => {
        estado[inp.dataset.d][inp.dataset.time] = inp.value;
        render(); actualizarStats();
      });
    });
    actualizarStats();
  }

  document.getElementById('btn-guardar').addEventListener('click', async function () {
    const ok = document.getElementById('msg-ok');
    const err = document.getElementById('msg-err');
    ok.classList.remove('show'); err.classList.remove('show');
    this.disabled = true; this.textContent = 'Guardando...';

    const payload = DIAS.filter(d => estado[d].activo).map(d => ({
      dia_semana: d,
      hora_inicio: estado[d].ini,
      hora_fin: estado[d].fin,
    }));

    const invalido = payload.find(p => p.hora_fin <= p.hora_inicio);
    if (invalido) {
      err.textContent = `En ${invalido.dia_semana} la hora de salida debe ser mayor que la de entrada.`;
      err.classList.add('show');
      this.disabled = false; this.innerHTML = '<i data-icon="check"></i>Guardar cambios';
      MCIcons.render(this);
      return;
    }

    try {
      const res = await fetch('/api/mis-horarios.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (data.success) {
        ok.textContent = data.mensaje || 'Horarios actualizados';
        ok.classList.add('show');
      } else {
        err.textContent = data.error || 'Error al guardar';
        err.classList.add('show');
      }
    } catch {
      err.textContent = 'No se pudo conectar';
      err.classList.add('show');
    }
    this.disabled = false; this.innerHTML = '<i data-icon="check"></i>Guardar cambios';
    MCIcons.render(this);
  });

  (async function () {
    await MC.requireAuth('medico');
    try {
      const horarios = await fetch('/api/mis-horarios.php').then(r => r.json()) || [];
      horarios.forEach(h => {
        if (estado[h.dia_semana]) {
          estado[h.dia_semana] = {
            activo: !!h.activo,
            ini: (h.hora_inicio || '08:00').substring(0, 5),
            fin: (h.hora_fin || '17:00').substring(0, 5),
          };
        }
      });
    } catch {}
    render();
  })();
</script>

</body>
</html>
