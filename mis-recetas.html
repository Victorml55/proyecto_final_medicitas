<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>Mis Recetas | MediCitas SSL</title>
    <script>
        fetch('/api/auth-status.php').then(r=>r.json()).then(d=>{
            if (!d.loggedIn) window.location.replace('/index.html');
        });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="css/estilo.css">
    <style>
        .recetas-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 24px;
        }
        .receta-card {
            background: var(--bg-card, #1e293b);
            border: 1px solid var(--border, rgba(148,163,184,.15));
            border-radius: 14px;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .receta-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(37,99,235,.15);
            color: #60a5fa;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 22px;
        }
        .receta-info {
            flex: 1;
            min-width: 0;
        }
        .receta-nombre {
            font-weight: 600;
            font-size: .97rem;
            color: var(--text-primary, #f1f5f9);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .receta-meta {
            font-size: .82rem;
            color: var(--text-muted, #94a3b8);
            margin-top: 3px;
        }
        .receta-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .btn-download {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: .85rem;
            font-weight: 500;
            background: var(--accent, #2563eb);
            color: #fff;
            text-decoration: none;
            transition: background .2s;
        }
        .btn-download:hover { background: #1d4ed8; }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }
        .empty-state .material-symbols-outlined {
            font-size: 56px;
            display: block;
            margin-bottom: 16px;
            opacity: .4;
        }
        @media (max-width: 600px) {
            .receta-card { flex-wrap: wrap; }
            .receta-actions { width: 100%; }
            .btn-download { flex: 1; justify-content: center; }
        }
    </style>
</head>
<body class="cuerpo-pagina">

    <div id="nav-container"></div>

    <main class="contenido-pagina">
        <div class="section-header" style="text-align:left; margin-bottom:30px;">
            <h1>Mis Recetas</h1>
            <p>Recetas médicas en PDF emitidas durante tus consultas.</p>
        </div>

        <div id="lista-recetas">
            <p style="color:#94a3b8;">Cargando...</p>
        </div>
    </main>

    <script>
        fetch('/api/auth-status.php').then(r=>r.json()).then(auth=>{
            const nav = auth.id_medico ? 'nav-medico.html' : 'nav-user.html';
            fetch(nav).then(r=>r.text()).then(d=>{document.getElementById('nav-container').innerHTML=d;});
        });

        const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

        function drLabel(g) { return g === 'M' ? 'Dr.' : g === 'F' ? 'Dra.' : 'Dr(a).'; }

        function formatFecha(str) {
            if (!str) return '—';
            const d = new Date(str);
            return `${d.getDate()} de ${meses[d.getMonth()]} de ${d.getFullYear()}`;
        }

        (async function () {
            const datos = await fetch('/api/resultados.php').then(r => r.json());
            const el    = document.getElementById('lista-recetas');

            const recetas = Array.isArray(datos) ? datos.filter(a => a.categoria === 'receta') : [];

            if (!recetas.length) {
                el.innerHTML = `
                    <div class="empty-state">
                        <span class="material-symbols-outlined">medication</span>
                        <p>No tienes recetas médicas disponibles todavía.</p>
                        <p style="font-size:.85rem;margin-top:6px;">Aparecerán aquí después de tus consultas.</p>
                    </div>`;
                return;
            }

            el.innerHTML = `<div class="recetas-list">` +
                recetas.map(r => {
                    const meta = [
                        r.fecha_subida ? formatFecha(r.fecha_subida) : null,
                        r.nombre_medico ? drLabel(r.genero_medico) + ' ' + r.nombre_medico : null,
                        r.fecha_cita    ? 'Cita: ' + formatFecha(r.fecha_cita) : null,
                    ].filter(Boolean).join(' · ');

                    return `
                    <div class="receta-card">
                        <div class="receta-icon">
                            <span class="material-symbols-outlined">picture_as_pdf</span>
                        </div>
                        <div class="receta-info">
                            <div class="receta-nombre">${r.nombre_archivo}</div>
                            <div class="receta-meta">${meta}</div>
                        </div>
                        <div class="receta-actions">
                            <a href="/api/descargar-resultado.php?id=${r.id_archivo}"
                               target="_blank" class="btn-download">
                                <span class="material-symbols-outlined" style="font-size:18px;">download</span>
                                Ver / Descargar
                            </a>
                        </div>
                    </div>`;
                }).join('') +
            `</div>`;
        })();
    </script>
</body>
</html>
