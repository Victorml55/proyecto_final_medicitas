<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis recetas | MediCitas SSL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<div class="proto-shell">
  <div id="nav-container"></div>
  <main>
    <div class="page">

      <div class="page-header row between">
        <div>
          <p class="eyebrow">Tu medicación</p>
          <h1>Mis recetas</h1>
          <p>Consulta tu medicación activa, recordatorios y renovaciones.</p>
        </div>
      </div>

      <div class="grid-3" style="margin-bottom:28px;">
        <div class="stat-card" data-tone="primary">
          <div class="stat-head"><div class="stat-icon"><i data-icon="pill" data-size="18"></i></div></div>
          <div class="stat-n" id="stat-activas">—</div>
          <div class="stat-label">Recetas activas</div>
        </div>
        <div class="stat-card" data-tone="warm">
          <div class="stat-head"><div class="stat-icon"><i data-icon="bell" data-size="18"></i></div></div>
          <div class="stat-n" id="stat-total">—</div>
          <div class="stat-label">Total emitidas</div>
        </div>
        <div class="stat-card" data-tone="success">
          <div class="stat-head"><div class="stat-icon"><i data-icon="check" data-size="18"></i></div></div>
          <div class="stat-n" id="stat-ultima">—</div>
          <div class="stat-label">Días desde última</div>
        </div>
      </div>

      <div class="section-title">
        <h2>Historial de recetas</h2>
      </div>

      <div class="stack" id="lista-recetas">
        <div class="loading-empty">Cargando recetas...</div>
      </div>

    </div>
  </main>
</div>

<script src="js/utils.js"></script>
<script src="js/icons.js"></script>
<script>
  MC.loadNav('nav-user.html');

  (async function () {
    const auth = await MC.requireAuth();
    if (!auth || !auth.id_paciente) return;

    try {
      const recetas = await fetch('/api/recetas.php?paciente=' + auth.id_paciente).then(r => r.json()) || [];

      const activas = recetas.filter(r => r.activa);
      document.getElementById('stat-activas').textContent = activas.length;
      document.getElementById('stat-total').textContent = recetas.length;

      if (recetas.length) {
        const ult = new Date(recetas[0].fecha_emision || recetas[0].fecha);
        const dias = Math.floor((new Date() - ult) / 86400000);
        document.getElementById('stat-ultima').textContent = dias >= 0 ? dias : '—';
      }

      const lista = document.getElementById('lista-recetas');
      if (!recetas.length) {
        lista.innerHTML = `
          <div class="card" style="text-align:center;padding:60px 20px;">
            <i data-icon="pill" data-size="32" style="color:var(--text-3);margin-bottom:12px;"></i>
            <h3 style="font-size:18px;margin-bottom:6px;">Aún no tienes recetas</h3>
            <p style="color:var(--text-2);">Tus recetas aparecerán aquí después de cada consulta.</p>
          </div>`;
        MCIcons.render(lista);
        return;
      }

      lista.innerHTML = recetas.map(r => {
        const status = r.activa
          ? '<span class="badge success"><span class="badge-dot"></span>Activa</span>'
          : '<span class="badge muted"><span class="badge-dot"></span>Histórica</span>';
        const meds = (r.medicamentos || []).map(m => `
          <div class="med-row">
            <div class="med-icon"><i data-icon="pill" data-size="18"></i></div>
            <div class="med-info">
              <strong>${m.nombre || ''} ${m.dosis ? '· ' + m.dosis : ''}</strong>
              <span>${m.frecuencia || ''} ${m.duracion ? '· ' + m.duracion : ''}</span>
            </div>
          </div>`).join('');

        return `
        <div class="receta-card ${r.activa ? '' : 'expired'}">
          <div class="receta-head">
            <div>
              <div class="row" style="gap:10px;margin-bottom:4px;">
                <strong style="font-family:var(--font-display);font-size:18px;">Receta #${r.id_receta || r.id || '—'}</strong>
                ${status}
              </div>
              <span style="font-size:13px;color:var(--text-3);">
                Emitida el ${MC.fechaLarga(r.fecha_emision || r.fecha)} por ${MC.drLabel(r.genero_medico)} ${r.nombre_medico || ''}
              </span>
            </div>
            <button class="btn btn-ghost btn-sm"><i data-icon="file-text" data-size="14"></i>Descargar PDF</button>
          </div>
          <div class="med-list">${meds || '<div class="loading-empty" style="padding:14px 0;">Sin medicamentos especificados</div>'}</div>
        </div>`;
      }).join('');
      MCIcons.render(lista);

    } catch (e) {
      document.getElementById('lista-recetas').innerHTML = '<div class="loading-empty">No se pudieron cargar las recetas.</div>';
    }
  })();
</script>

</body>
</html>
