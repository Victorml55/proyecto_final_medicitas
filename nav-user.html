<script>
  // Pinta nombre/iniciales del paciente en el footer del sidebar
  fetch('/api/auth-status.php').then(r => r.json()).then(d => {
    if (!d.loggedIn) return;
    const nombre = d.nombre || 'Usuario';
    const ini = (window.MC && MC.iniciales) ? MC.iniciales(nombre) : '??';
    const elN = document.getElementById('user-nombre');
    const elI = document.getElementById('user-iniciales');
    if (elN) elN.textContent = nombre;
    if (elI) elI.textContent = ini;
  });
</script>
