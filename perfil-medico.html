<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil de médico | MediCitas SSL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<div class="proto-shell">
  <div id="nav-container"></div>
  <main>
    <div class="page">

      <a href="medicos.html" class="btn btn-ghost btn-sm" style="margin-bottom:18px;">
        <i data-icon="chevron-left"></i>Volver al directorio
      </a>

      <div id="perfil-content">
        <div class="card" style="text-align:center;padding:60px 20px;">
          <div class="loading-empty">Cargando perfil...</div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="js/utils.js"></script>
<script src="js/icons.js"></script>
<script>
  fetch('/api/auth-status.php').then(r => r.json()).then(d => {
    MC.loadNav(d.rol === 'medico' ? 'nav-medico.html' : 'nav-user.html');
  }).catch(() => MC.loadNav('nav-user.html'));

  (async function () {
    const id = new URLSearchParams(window.location.search).get('id');
    if (!id) { document.getElementById('perfil-content').innerHTML = '<div class="loading-empty">Falta el médico.</div>'; return; }

    try {
      const m = await fetch('/api/medicos.php?id=' + id).then(r => r.json());
      if (!m || !m.id_medico) throw new Error();

      const titulo = MC.drLabel(m.genero);
      const exp = m.fecha_inicio ? Math.max(0, new Date().getFullYear() - new Date(m.fecha_inicio).getFullYear()) : null;

      document.getElementById('perfil-content').innerHTML = `
      <div class="card flush" style="overflow:hidden;">
        <div class="doc-hero">
          <div class="doc-hero-bg"></div>
          <div class="doc-hero-content">
            <div class="doc-hero-avatar">${MC.iniciales(m.nombre_completo)}</div>
            <div class="doc-hero-info">
              <p style="color:rgba(255,255,255,0.75);font-size:12px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;">Especialista certificado</p>
              <h1 style="color:white;font-size:38px;margin:6px 0 10px;">${titulo} ${m.nombre_completo}</h1>
              <div class="row" style="gap:10px;flex-wrap:wrap;">
                <span class="badge" style="background:rgba(255,255,255,0.18);color:white;">
                  <span class="badge-dot" style="background:oklch(0.85 0.18 150);"></span>${m.nombre_especialidad || 'Especialista'}
                </span>
                ${exp !== null ? `<span class="badge" style="background:rgba(255,255,255,0.18);color:white;"><i data-icon="briefcase" data-size="12"></i>${exp} años de experiencia</span>` : ''}
                ${m.cedula_profesional ? `<span class="badge" style="background:rgba(255,255,255,0.18);color:white;">Cédula ${m.cedula_profesional}</span>` : ''}
              </div>
            </div>
            <div class="doc-hero-cta">
              <a href="agendar-cita.html?medico=${m.id_medico}" class="btn btn-lg" style="background:white;color:var(--primary);">
                Agendar cita<i data-icon="arrow-right"></i>
              </a>
            </div>
          </div>
        </div>

        <div class="doc-body">
          <div class="grid-2" style="grid-template-columns:1.6fr 1fr;margin-top:8px;align-items:flex-start;">
            <div class="stack">
              <section>
                <h3 style="font-size:18px;margin-bottom:10px;">Sobre ${titulo} ${m.nombre_completo.split(' ')[0]}</h3>
                <p style="color:var(--text-2);line-height:1.7;font-size:14px;">
                  ${m.biografia || 'Especialista certificado del Sanatorio Santa Lucía con amplia experiencia clínica. Cree en una medicina cercana, basada en escuchar al paciente y explicar cada paso del diagnóstico y tratamiento.'}
                </p>
              </section>

              <section>
                <h3 style="font-size:18px;margin-bottom:12px;">Información profesional</h3>
                <div class="info-grid">
                  <div class="info-item"><span class="info-label">Cédula</span><span class="info-value">${m.cedula_profesional || '—'}</span></div>
                  <div class="info-item"><span class="info-label">Especialidad</span><span class="info-value" data-highlight>${m.nombre_especialidad || '—'}</span></div>
                  ${exp !== null ? `<div class="info-item"><span class="info-label">Experiencia</span><span class="info-value">${exp} años</span></div>` : ''}
                  <div class="info-item"><span class="info-label">Consultorio</span><span class="info-value">${m.consultorio || 'A confirmar'}</span></div>
                </div>
              </section>
            </div>

            <div class="stack" style="position:sticky;top:24px;">
              <div class="card">
                <h3 style="font-size:15px;margin-bottom:14px;">Información de la consulta</h3>
                <div class="stack" style="gap:12px;">
                  <div class="summary-row"><div class="summary-icon"><i data-icon="map-pin" data-size="16"></i></div><div class="summary-info"><div class="summary-label">Consultorio</div><div class="summary-value">${m.consultorio || 'A confirmar'}</div></div></div>
                  <div class="summary-row"><div class="summary-icon"><i data-icon="clock" data-size="16"></i></div><div class="summary-info"><div class="summary-label">Duración</div><div class="summary-value">30–45 min</div></div></div>
                  <div class="summary-row"><div class="summary-icon"><i data-icon="mail" data-size="16"></i></div><div class="summary-info"><div class="summary-label">Contacto</div><div class="summary-value">${m.email || '—'}</div></div></div>
                </div>
                <a href="agendar-cita.html?medico=${m.id_medico}" class="btn btn-primary" style="width:100%;margin-top:14px;">
                  Ver agenda disponible<i data-icon="arrow-right"></i>
                </a>
              </div>

              <div class="card" style="background:var(--warm-soft);border-color:transparent;">
                <div class="row" style="gap:12px;align-items:flex-start;">
                  <i data-icon="phone" data-size="20" style="color:var(--warm-ink);margin-top:2px;"></i>
                  <div>
                    <strong style="display:block;margin-bottom:4px;">¿Necesitas ayuda?</strong>
                    <p style="font-size:13px;color:var(--text-2);">
                      Habla con un asesor médico al <strong>461 234 5000</strong>.
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>`;
      MCIcons.render(document.getElementById('perfil-content'));

    } catch (e) {
      document.getElementById('perfil-content').innerHTML = '<div class="card" style="text-align:center;padding:60px 20px;"><div class="loading-empty">No se pudo cargar el perfil del médico.</div></div>';
    }
  })();
</script>

</body>
</html>
