<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultados de laboratorio | MediCitas SSL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<div class="proto-shell">
  <div id="nav-container"></div>
  <main>
    <div class="page">

      <div class="page-header row between">
        <div>
          <p class="eyebrow">Análisis clínicos</p>
          <h1>Resultados de laboratorio</h1>
          <p>Tus estudios y diagnósticos del Sanatorio Santa Lucía.</p>
        </div>
        <a href="agendar-cita-laboratorio.html" class="btn btn-primary">
          <i data-icon="plus"></i>Agendar estudio
        </a>
      </div>

      <div class="section-title">
        <h2>Estudios recientes</h2>
        <div class="input-wrap" style="width:280px;">
          <i data-icon="search" class="input-icon"></i>
          <input class="input has-icon" placeholder="Buscar estudio" id="buscar">
        </div>
      </div>

      <div class="stack" id="lista-lab">
        <div class="loading-empty">Cargando resultados...</div>
      </div>

    </div>
  </main>
</div>

<script src="js/utils.js"></script>
<script src="js/icons.js"></script>
<script>
  MC.loadNav('nav-user.html');

  let TODOS = [];

  function render(q = '') {
    const filtrados = q
      ? TODOS.filter(s => (s.nombre_estudio || '').toLowerCase().includes(q.toLowerCase()))
      : TODOS;

    const lista = document.getElementById('lista-lab');
    if (!filtrados.length) {
      lista.innerHTML = `
        <div class="card" style="text-align:center;padding:60px 20px;">
          <i data-icon="flask" data-size="32" style="color:var(--text-3);margin-bottom:12px;"></i>
          <h3 style="font-size:18px;margin-bottom:6px;">Sin resultados</h3>
          <p style="color:var(--text-2);">Aquí verás tus estudios cuando estén listos.</p>
        </div>`;
      MCIcons.render(lista);
      return;
    }

    lista.innerHTML = filtrados.map(s => {
      const ready = s.estado === 'listo' || s.archivo_resultado;
      const badge = ready
        ? '<span class="badge success"><span class="badge-dot"></span>Listo</span>'
        : '<span class="badge warning"><span class="badge-dot"></span>En proceso</span>';

      return `
      <div class="lab-row">
        <div class="lab-icon" data-status="${ready ? 'ready' : 'pending'}">
          <i data-icon="${ready ? 'file-text' : 'clock'}" data-size="20"></i>
        </div>
        <div class="lab-info">
          <div class="row" style="gap:8px;margin-bottom:4px;">
            <strong style="font-size:16px;font-family:var(--font-display);font-weight:500;">${s.nombre_estudio || 'Estudio'}</strong>
            ${badge}
          </div>
          <div class="lab-meta">
            <span>Folio #${s.id_resultado || s.id || '—'}</span>
            <span>·</span>
            <span>${MC.fechaLarga(s.fecha_resultado || s.fecha)}</span>
            ${s.nombre_medico ? `<span>·</span><span>Solicitado por ${MC.drLabel(s.genero_medico)} ${s.nombre_medico}</span>` : ''}
          </div>
        </div>
        <div class="row" style="gap:8px;">
          ${ready
            ? `<a href="/api/descargar-resultado.php?id=${s.id_resultado}" class="btn btn-ghost btn-sm"><i data-icon="file-text" data-size="14"></i>PDF</a>
               <button class="btn btn-primary btn-sm"><i data-icon="eye" data-size="14"></i>Ver resultados</button>`
            : '<button class="btn btn-ghost btn-sm">Ver indicaciones</button>'}
        </div>
      </div>`;
    }).join('');
    MCIcons.render(lista);
  }

  document.getElementById('buscar').addEventListener('input', e => render(e.target.value));

  (async function () {
    const auth = await MC.requireAuth();
    if (!auth || !auth.id_paciente) return;
    try {
      TODOS = await fetch('/api/resultados.php?paciente=' + auth.id_paciente).then(r => r.json()) || [];
      render();
    } catch (e) {
      document.getElementById('lista-lab').innerHTML = '<div class="loading-empty">No se pudieron cargar los resultados.</div>';
    }
  })();
</script>

</body>
</html>
