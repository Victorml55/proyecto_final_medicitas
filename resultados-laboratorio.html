<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>Resultados de Laboratorio | MediCitas SSL</title>
    <script>
        fetch('/api/auth-status.php').then(r=>r.json()).then(d=>{
            if (!d.loggedIn) window.location.replace('/index.html');
        });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="css/estilo.css">
    <style>
        .resultados-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 24px;
        }
        .resultado-card {
            background: var(--bg-card, #1e293b);
            border: 1px solid var(--border, rgba(148,163,184,.15));
            border-radius: 14px;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .resultado-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 22px;
        }
        .resultado-icon.pdf   { background: rgba(239,68,68,.15);  color: #ef4444; }
        .resultado-icon.img   { background: rgba(59,130,246,.15); color: #3b82f6; }
        .resultado-icon.doc   { background: rgba(99,102,241,.15); color: #6366f1; }
        .resultado-icon.xls   { background: rgba(34,197,94,.15);  color: #22c55e; }
        .resultado-icon.other { background: rgba(148,163,184,.15);color: #94a3b8; }
        .resultado-info {
            flex: 1;
            min-width: 0;
        }
        .resultado-nombre {
            font-weight: 600;
            font-size: .97rem;
            color: var(--text-primary, #f1f5f9);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .resultado-meta {
            font-size: .82rem;
            color: var(--text-muted, #94a3b8);
            margin-top: 3px;
        }
        .resultado-desc {
            font-size: .85rem;
            color: var(--text-secondary, #cbd5e1);
            margin-top: 5px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .resultado-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .btn-download {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: .85rem;
            font-weight: 500;
            background: var(--accent, #2563eb);
            color: #fff;
            text-decoration: none;
            transition: background .2s;
        }
        .btn-download:hover { background: #1d4ed8; }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }
        .empty-state .material-symbols-outlined {
            font-size: 56px;
            display: block;
            margin-bottom: 16px;
            opacity: .4;
        }
        @media (max-width: 600px) {
            .resultado-card { flex-wrap: wrap; }
            .resultado-actions { width: 100%; }
            .btn-download { flex: 1; justify-content: center; }
        }
    </style>
</head>
<body class="cuerpo-pagina">

    <div id="nav-container"></div>

    <main class="contenido-pagina">
        <div class="section-header" style="text-align:left; margin-bottom:30px;">
            <h1>Resultados de Laboratorio</h1>
            <p>Archivos e informes médicos compartidos por tu médico tratante.</p>
        </div>

        <div id="lista-resultados">
            <p style="color:#94a3b8;">Cargando...</p>
        </div>
    </main>

    <script>
        fetch('/api/auth-status.php').then(r=>r.json()).then(auth=>{
            const nav = auth.id_medico ? 'nav-medico.html' : 'nav-user.html';
            fetch(nav).then(r=>r.text()).then(d=>{document.getElementById('nav-container').innerHTML=d;});
        });

        const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

        function drLabel(g) { return g === 'M' ? 'Dr.' : g === 'F' ? 'Dra.' : 'Dr(a).'; }

        function formatFecha(str) {
            if (!str) return '—';
            const d = new Date(str);
            return `${d.getDate()} de ${meses[d.getMonth()]} de ${d.getFullYear()}`;
        }

        function iconoTipo(tipo) {
            if (!tipo) return { clase: 'other', icono: 'description' };
            const t = tipo.toLowerCase();
            if (t === 'pdf')                       return { clase: 'pdf',   icono: 'picture_as_pdf' };
            if (['jpg','jpeg','png','gif','webp'].includes(t)) return { clase: 'img', icono: 'image' };
            if (['doc','docx'].includes(t))        return { clase: 'doc',   icono: 'article' };
            if (['xls','xlsx'].includes(t))        return { clase: 'xls',   icono: 'table_chart' };
            return { clase: 'other', icono: 'description' };
        }

        function formatTamaño(kb) {
            if (!kb) return '';
            return kb >= 1024 ? (kb / 1024).toFixed(1) + ' MB' : kb + ' KB';
        }

        (async function () {
            const todos  = await fetch('/api/resultados.php').then(r => r.json());
            const datos  = Array.isArray(todos) ? todos.filter(a => a.categoria !== 'receta') : [];
            const el     = document.getElementById('lista-resultados');

            if (!datos.length) {
                el.innerHTML = `
                    <div class="empty-state">
                        <span class="material-symbols-outlined">lab_panel</span>
                        <p>No tienes resultados de laboratorio disponibles todavía.</p>
                        <p style="font-size:.85rem;margin-top:6px;">Cuando tu médico suba un archivo, aparecerá aquí.</p>
                    </div>`;
                return;
            }

            el.innerHTML = `<div class="resultados-list">` +
                datos.map(a => {
                    const { clase, icono } = iconoTipo(a.tipo_archivo);
                    const meta = [
                        a.fecha_subida ? formatFecha(a.fecha_subida) : null,
                        a.nombre_medico ? drLabel(a.genero_medico) + ' ' + a.nombre_medico : null,
                        a.fecha_cita    ? 'Cita: ' + formatFecha(a.fecha_cita) : null,
                        formatTamaño(a.tamaño_kb),
                    ].filter(Boolean).join(' · ');

                    return `
                    <div class="resultado-card">
                        <div class="resultado-icon ${clase}">
                            <span class="material-symbols-outlined">${icono}</span>
                        </div>
                        <div class="resultado-info">
                            <div class="resultado-nombre">${a.nombre_archivo}</div>
                            <div class="resultado-meta">${meta}</div>
                            ${a.descripcion ? `<div class="resultado-desc">${a.descripcion}</div>` : ''}
                        </div>
                        <div class="resultado-actions">
                            <a href="/api/descargar-resultado.php?id=${a.id_archivo}"
                               target="_blank" class="btn-download">
                                <span class="material-symbols-outlined" style="font-size:18px;">download</span>
                                Ver / Descargar
                            </a>
                        </div>
                    </div>`;
                }).join('') +
            `</div>`;
        })();
    </script>
</body>
</html>
